<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141312">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atomic GVD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap&subset=latin-ext">
<style>
/* ============ TOKENS — temă dark unică, aleasă deliberat ============ */
:root{
  --bg:#141312;            /* fundal */
  --surface:#1D1B19;       /* card */
  --raised:#26231F;        /* card ridicat / input */
  --line:#33302B;          /* borduri */
  --ink:#EDE7DD;           /* text principal */
  --ink2:#A89F92;          /* text secundar */
  --ink3:#6E675D;          /* text estompat */
  --accent:#E0A458;        /* chihlimbar — brand */
  --accent-deep:#8A6428;
  --good:#3FA351;
  --danger:#C4543E;
  --r:16px;
  --font-d:'Fraunces',Georgia,serif;
  --font-b:'Karla','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:16px;line-height:1.5;
  min-height:100dvh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
#app{max-width:480px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ============ HEADER ============ */
header{padding:22px 0 6px}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand .logo{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--accent)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.datenav h1{font-size:26px}
.datenav .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.navbtns{display:flex;gap:6px}
.navbtns button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:18px;display:grid;place-items:center}
.navbtns button:disabled{opacity:.35}
.todaychip{margin-top:8px;display:none}
.todaychip button{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* bandă voturi */
.votebar{margin:14px 0 4px;padding:12px 16px;background:linear-gradient(135deg,#221D15,#1D1B19);border:1px solid #3A311F;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center}
.votebar .n{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--accent)}
.votebar .t{font-size:13px;color:var(--ink2);max-width:230px;line-height:1.35}

/* ============ CARDURI OBICEI (Azi) ============ */
.hlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;transition:border-color .25s}
.hcard.done{border-color:color-mix(in srgb,var(--hc) 45%,var(--line))}
.hcard.offday{opacity:.5}
.hcard .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc);opacity:.9}
.checkbtn{flex:none;width:52px;height:52px;position:relative;display:grid;place-items:center}
.checkbtn svg{position:absolute;inset:0;width:52px;height:52px}
.checkbtn .ringbg{fill:none;stroke:var(--line);stroke-width:3}
.checkbtn .ringfg{fill:none;stroke:var(--hc);stroke-width:3;stroke-linecap:round;stroke-dasharray:151;stroke-dashoffset:151;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1)}
.hcard.done .ringfg{stroke-dashoffset:0}
.checkbtn .tick{width:20px;height:20px;stroke:var(--hc);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.3s .15s}
.hcard.done .tick{opacity:1;transform:scale(1)}
.hbody{flex:1;min-width:0}
.hname{font-weight:700;font-size:16px}
.hcue{font-size:12.5px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--raised);color:var(--ink2);border:1px solid var(--line)}
.pill.hot{color:var(--hc);border-color:color-mix(in srgb,var(--hc) 40%,transparent)}
.pill.warn{color:var(--accent);border-color:var(--accent-deep)}
.wkdots{display:flex;gap:4px;align-items:center}
.wkdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wkdots i.on{background:var(--hc)}

/* somn */
.sleepctl{display:flex;align-items:center;gap:8px;margin-top:9px}
.sleepctl .stepper{width:42px;height:38px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-weight:700;color:var(--ink2);font-size:15px}
.sleepctl .val{font-family:var(--font-d);font-size:21px;font-weight:600;min-width:78px;text-align:center}
.sleepctl .val small{font-size:13px;color:var(--ink2);font-family:var(--font-b)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{font-size:12.5px;padding:5px 12px;border-radius:99px;background:var(--raised);border:1px solid var(--line);color:var(--ink2)}

/* mesaj salvare (never miss twice) */
.rescue{margin-top:8px;font-size:12.5px;color:var(--accent);background:#221C12;border:1px solid #3A311F;border-radius:10px;padding:8px 10px;line-height:1.4}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(90vw,420px);opacity:0;pointer-events:none;transition:.35s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* celebrare */
#cele{position:fixed;inset:0;background:rgba(10,9,8,.8);backdrop-filter:blur(6px);display:none;place-items:center;z-index:70;padding:24px}
#cele.show{display:grid}
#cele .box{background:var(--surface);border:1px solid #3A311F;border-radius:22px;padding:34px 26px;text-align:center;max-width:340px;animation:pop .5s cubic-bezier(.22,1.4,.36,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#cele .big{font-family:var(--font-d);font-size:52px;font-weight:700;color:var(--accent);line-height:1}
#cele h2{font-size:21px;margin-top:10px}
#cele p{color:var(--ink2);font-size:14px;margin-top:8px}
#cele button{margin-top:20px;background:var(--accent);color:#141312;font-weight:700;padding:11px 26px;border-radius:12px;font-size:15px}

/* ============ RAPOARTE ============ */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.periodnav h2{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--hc);flex:none}
.card .sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.progress{height:8px;background:var(--raised);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--hc);transition:width .5s}
.statrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px;color:var(--ink2)}
.statrow b{font-family:var(--font-d);font-size:17px;color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--font-d);font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.3}
.heat{display:grid;grid-auto-flow:column;gap:3px;margin-top:12px;justify-content:start;overflow-x:auto;padding-bottom:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat .cell{width:13px;height:13px;border-radius:3.5px;background:var(--raised)}
.heat .cell.off{background:transparent;border:1px dashed #2A2825}
.heat .cell.miss{background:#2E2A25}
.heat .cell.p1{background:color-mix(in srgb,var(--hc) 35%,var(--raised))}
.heat .cell.p2{background:color-mix(in srgb,var(--hc) 65%,var(--raised))}
.heat .cell.p3{background:var(--hc)}
.heat .cell.today{outline:1.5px solid var(--ink2);outline-offset:1px}
.heatlbl{display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:8px;align-items:center;flex-wrap:wrap}
.heatlbl .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
.dow{display:flex;gap:6px;margin-top:12px;align-items:flex-end;height:90px}
.dow .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.dow .bar{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 55%,var(--raised));min-height:2px}
.dow .lb{font-size:10.5px;color:var(--ink3)}
.dow .pv{font-size:10.5px;color:var(--ink2)}
.callout{margin-top:12px;font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding:8px 12px;background:var(--raised);border-radius:0 10px 10px 0;line-height:1.45}
.callout b{color:var(--ink)}

/* ============ OBICEIURI (management) ============ */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center}
.mcard .cdot{width:14px;height:14px;border-radius:50%;background:var(--hc);flex:none}
.mcard .mb{flex:1;min-width:0}
.mcard .mn{font-weight:700}
.mcard .mi{font-size:12.5px;color:var(--ink3)}
.mcard .acts{display:flex;gap:4px}
.mcard .acts button{width:38px;height:38px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.addbtn{margin-top:14px;width:100%;padding:14px;border-radius:var(--r);border:1.5px dashed var(--accent-deep);color:var(--accent);font-weight:700;font-size:15px}
.arch-h{margin-top:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* modal formular */
#modal{position:fixed;inset:0;background:rgba(10,9,8,.75);backdrop-filter:blur(4px);display:none;z-index:50;overflow-y:auto;padding:20px 0}
#modal.show{display:block}
#modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;max-width:460px;margin:0 auto;padding:22px 18px;width:calc(100% - 24px)}
#modal h2{font-size:20px;margin-bottom:4px}
#modal .note{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.field{margin-top:13px}
.field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.4}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.togglerow{display:flex;justify-content:space-between;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:13px}
.togglerow span{font-size:14px}
.tg{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);transition:.25s;flex:none}
.tg.on{background:var(--accent)}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.25s}
.tg.on i{left:23px;background:#141312}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--ink);transform:scale(1.1)}
.freqrow{display:flex;align-items:center;gap:10px}
.freqrow button{width:40px;height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--ink2)}
.freqrow .fv{font-family:var(--font-d);font-size:20px;font-weight:600;min-width:74px;text-align:center}
.mact{display:flex;gap:10px;margin-top:22px}
.mact button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.btn-p{background:var(--accent);color:#141312}
.btn-s{background:var(--raised);border:1px solid var(--line);color:var(--ink2)}
.btn-d{background:none;border:1px solid #5A3128;color:var(--danger)}

/* ============ SETĂRI ============ */
.set-h{margin-top:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;margin-top:8px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14.5px}
.setrow .sd{font-size:12px;color:var(--ink3);margin-top:1px;line-height:1.35}
.setrow input[type=time]{width:auto;padding:7px 10px}
.setrow>button{color:var(--accent);font-weight:700;font-size:14px;flex:none}
.setrow>button.dng{color:var(--danger)}
.about p{font-size:13.5px;color:var(--ink2);padding:11px 0;line-height:1.55}
.about b{color:var(--ink)}

/* ============ ONBOARDING ============ */
.onb{background:linear-gradient(150deg,#221D15,#1A1816);border:1px solid #3A311F;border-radius:20px;padding:22px 18px;margin-top:16px}
.onb h2{font-size:20px;color:var(--accent)}
.onb p{font-size:13.5px;color:var(--ink2);margin-top:9px;line-height:1.55}
.onb b{color:var(--ink)}
.onb button{margin-top:16px;background:var(--accent);color:#141312;font-weight:700;padding:11px 22px;border-radius:12px}

/* ============ ABONAMENTE ============ */
.vbar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:9px;overflow:hidden;max-width:210px}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.listsep{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:14px 0 2px;padding-left:2px}
.aboalert{background:#231B12;border:1px solid #4A3720;border-radius:var(--r);padding:13px 15px;margin-top:14px}
.aboalert .t{font-weight:700;font-size:14px;color:var(--accent)}
.aboalert .r{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin-top:6px}
.aboalert .r b{color:var(--ink);font-weight:600;white-space:nowrap}
.aboalert button{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.filters{display:flex;gap:8px;margin-top:14px}
.filters select{flex:1;font-size:13.5px;padding:9px 10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;border-left:3px solid var(--line)}
.scard.warn{border-left-color:var(--accent)}
.scard.late{border-left-color:var(--danger)}
.scard.ok{border-left-color:#3E5C46}
.scard.soon{border-left-color:#3E4C6B}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sname{font-weight:700;font-size:16px;line-height:1.25}
.stags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--ink2);border:1px solid var(--line)}
.tag.t2{color:#C6B79E}
.tag.t3{color:var(--accent);border-color:var(--accent-deep)}
.sedit{width:36px;height:36px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.sprice{display:flex;align-items:baseline;gap:8px;margin-top:11px;flex-wrap:wrap}
.sprice b{font-family:var(--font-d);font-size:21px;font-weight:600}
.sprice span{font-size:13px;color:var(--ink2)}
.sprice .sep{color:var(--ink3)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.stat{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--raised);border:1px solid var(--line)}
.stat.warn{color:var(--accent);border-color:var(--accent-deep)}
.stat.late{color:var(--danger);border-color:#5A3128}
.stat.ok{color:#8FB894;border-color:#31462F}
.stat.soon{color:#96AACB;border-color:#2F3A4A}
.sfoot{font-size:12px;color:var(--ink3);margin-top:8px}
.sobs{font-size:12.5px;color:var(--ink2);margin-top:8px;padding:8px 10px;background:var(--raised);border-radius:9px;line-height:1.4}
.sess{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.sess .sl{font-size:12.5px;color:var(--ink2)}
.sess .sl b{color:var(--ink)}
.sdots{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.sdots button{width:38px;height:38px;border-radius:11px;background:var(--raised);border:1px solid var(--line);color:var(--ink3);font-weight:700;font-size:13px;transition:.2s}
.sdots button.on{background:var(--accent);border-color:var(--accent);color:#141312}
.sdates{font-size:11.5px;color:var(--ink3);margin-top:7px}
.brow{display:flex;align-items:center;gap:10px;margin-top:10px}
.brow .bl{font-size:13px;color:var(--ink2);width:98px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{flex:1;height:8px;background:var(--raised);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--accent);opacity:.75;border-radius:99px}
.brow .bv{font-size:12.5px;color:var(--ink);width:78px;text-align:right;flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.prow:last-child{border-bottom:none}
.prow .pd{color:var(--ink3);width:64px;flex:none;font-size:12.5px}
.prow .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pv{color:var(--ink);font-weight:600}
.minitabs{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.minitabs button{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--raised);border:1px solid var(--line);color:var(--ink3)}
.minitabs button.on{background:var(--accent);border-color:var(--accent);color:#141312}
textarea{resize:vertical;line-height:1.45}

/* ============ TAB BAR ============ */
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs .in{max-width:480px;margin:0 auto;display:flex}
nav#tabs button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:9.5px;font-weight:600;letter-spacing:.02em}

<script>
"use strict";
/* ================================================================
   ATOMIC GVD — tracker de obiceiuri după principiile Atomic Habits
   Date locale: localStorage + export/import JSON.
   ================================================================ */

/* ---------------- utilitare de dată (săptămâna începe LUNI) ---------------- */
const ZI = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const ZIS = ["Lu","Ma","Mi","Jo","Vi","Sâ","Du"]; // ordonate luni→duminică
const LUNA = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const todayIso = () => iso(new Date());
const addDays = (s,n) => { const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => (fromIso(s).getDay()+6)%7;           // 0=luni … 6=duminică
const isWorkday = s => dow(s) < 5;
const weekStart = s => addDays(s, -dow(s));            // luni
const monthKey = s => s.slice(0,7);
const fmtDate = s => { const d=fromIso(s); return ZI[d.getDay()]+", "+d.getDate()+" "+LUNA[d.getMonth()]; };
const fmtH = v => { const h=Math.floor(v), m=Math.round((v-h)*60); return m? h+"h"+pad(m) : h+"h"; };
const fmtH2 = v => (Math.round(v*10)/10).toLocaleString("ro-RO",{minimumFractionDigits:0,maximumFractionDigits:1})+" h";

/* ---------------- stare ---------------- */
const LSKEY = "atomicgvd_v1";
const PALETA = ["#7D6FD6","#199E8C","#AA8F26","#3E85D1","#C96A2E","#C75FA1","#3FA351","#B4543E","#5A7FD1","#8A8A3E"];

function seedHabits(){
  const c = todayIso();
  return [
    {id:"h1", nume:"Somn decent", identitate:"Om odihnit",      tip:"somn", negativ:false, perWeek:6, lucratoare:false, tintaOre:7, culoare:"#7D6FD6", cue:"Dimineața, la trezire, notez orele dormite", creat:c, arhivat:false},
    {id:"h2", nume:"Înot dimineața", identitate:"Înotător",     tip:"bifa", negativ:false, perWeek:2, lucratoare:false, culoare:"#199E8C", cue:"Seara pun geanta de înot lângă ușă", creat:c, arhivat:false},
    {id:"h3", nume:"Mâncare de acasă", identitate:"Om organizat", tip:"bifa", negativ:false, perWeek:3, lucratoare:true, culoare:"#AA8F26", cue:"Seara pregătesc caserola pentru a doua zi", creat:c, arhivat:false},
    {id:"h4", nume:"Engleză", identitate:"Vorbitor de engleză", tip:"bifa", negativ:false, perWeek:7, lucratoare:false, culoare:"#3E85D1", cue:"După cafeaua de dimineață, fac lecția", creat:c, arhivat:false},
    {id:"h5", nume:"Fără FB, Flashscore, Sport.ro", identitate:"Om concentrat", tip:"bifa", negativ:true, perWeek:5, lucratoare:false, culoare:"#C96A2E", cue:"Fără aplicații de distragere pe primul ecran", creat:c, arhivat:false},
    {id:"h6", nume:"Postare Raduga", identitate:"Creator",      tip:"bifa", negativ:false, perWeek:2, lucratoare:false, culoare:"#C75FA1", cue:"După cină, în zilele alese, public postarea", creat:c, arhivat:false},
    {id:"h7", nume:"Fără bad habit", identitate:"Om liber",     tip:"bifa", negativ:true, perWeek:7, lucratoare:false, culoare:"#3FA351", cue:"Seara bifez ziua curată", creat:c, arhivat:false},
  ];
}

/* ---------------- abonamente: categorii, titulari, date inițiale ---------------- */
const CAT_DEF = ["Sănătate","Divertisment","Profesional","Casă — auto","Casă — general"];
const TIT_DEF = ["George","Casă","Familie"];
const CURS_DEF = 5.08;   // RON pentru 1 EUR — se schimbă din Setări
function seedSubs(){
  return [
    {id:"s1", nume:"Abonament înot",  categorie:"Sănătate",      titular:"George", moneda:"RON", pret:500, recTip:"zile", recN:30, start:"2026-10-20", auto:false, obs:"4 ședințe incluse", sesiuniTotal:4, sesiuni:[], activ:true},
    {id:"s2", nume:"Netflix",         categorie:"Divertisment",  titular:"George", moneda:"EUR", pret:5,   recTip:"zile", recN:30, start:"2026-08-30", auto:true,  obs:"", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s3", nume:"Duolingo",        categorie:"Divertisment",  titular:"George", moneda:"RON", pret:500, recTip:"ani",  recN:1,  start:"2026-05-20", auto:true,  obs:"", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s4", nume:"Praktika",        categorie:"Profesional",   titular:"George", moneda:"RON", pret:500, recTip:"ani",  recN:1,  start:"2026-05-30", auto:true,  obs:"", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s5", nume:"Rovinietă",       categorie:"Casă — auto",   titular:"Casă",   moneda:"RON", pret:130, recTip:"ani",  recN:1,  start:"2026-08-30", auto:false, obs:"", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s6", nume:"ITP",             categorie:"Casă — auto",   titular:"Casă",   moneda:"RON", pret:200, recTip:"ani",  recN:2,  start:"2024-09-20", auto:false, obs:"ITP Brașov", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s7", nume:"Asigurare RCA",   categorie:"Casă — auto",   titular:"Casă",   moneda:"RON", pret:1000,recTip:"ani",  recN:1,  start:"2025-10-02", auto:false, obs:"Omniasig", sesiuniTotal:0, sesiuni:[], activ:true},
    {id:"s8", nume:"Digi",            categorie:"Casă — general",titular:"Casă",   moneda:"RON", pret:64,  recTip:"luni", recN:1,  start:"2026-05-02", auto:true,  obs:"reînnoire automată", sesiuniTotal:0, sesiuni:[], activ:true},
  ];
}

let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ S=null; }
  if(!S || !S.habits){
    S = {v:1, habits:seedHabits(), entries:{}, settings:{
      notifOn:false, notifAm:"07:30", notifPm:"21:30", onboarded:false, celebrated:{}, lastNotif:{}
    }, meta:{updatedAt:0}, deleted:[]};
    save(false);
  }
  if(!S.settings.celebrated) S.settings.celebrated={};
  if(!S.settings.lastNotif) S.settings.lastNotif={};
  if(!S.meta) S.meta={updatedAt:0};
  if(!S.deleted) S.deleted=[];
  if(!S.subs){ S.subs=seedSubs(); S.subsDeleted=[]; save(false); }   // migrare: primele abonamente
  if(!S.subsDeleted) S.subsDeleted=[];
  if(!S.settings.curs) S.settings.curs=CURS_DEF;
  if(!S.settings.categorii) S.settings.categorii=[...CAT_DEF];
  if(!S.settings.titulari) S.settings.titulari=[...TIT_DEF];
}
function save(touch=true){
  if(touch) S.meta.updatedAt = Date.now();
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){ toast("Nu am putut salva datele — spațiu insuficient?"); }
  if(touch) scheduleSync();
}

/* ---------------- logica obiceiurilor ---------------- */
const windowDays = h => h.lucratoare ? 5 : 7;
const isDaily    = h => h.perWeek >= windowDays(h);
const schedDay   = (h,d) => h.lucratoare ? isWorkday(d) : true;   // zi în care obiceiul „contează”
const val        = (h,d) => (S.entries[d]||{})[h.id];
const isNum      = h => h.tip==="somn" || h.tip==="ore";   // obiceiuri măsurate în ore, cu țintă minimă
const okDay      = (h,d) => { const v = val(h,d); if(v==null) return false; return isNum(h) ? v>=h.tintaOre : !!v; };
const logged     = (h,d) => val(h,d) != null;

function weekDays(ws, h){ // zilele programate din săptămâna care începe la ws
  const out=[]; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(schedDay(h,d)) out.push(d); } return out;
}
function weekHits(h, ws){ return weekDays(ws,h).filter(d=>okDay(h,d)).length; }
function weekMet(h, ws){ return weekHits(h,ws) >= h.perWeek; }

/* ---- SERIE CU DREPT LA O OMISIUNE ----
   Regula: o zi ratată nu rupe seria (ai dreptul la o omisiune).
   Seria se încheie doar la 2 zile ratate consecutiv.
   Ziua de azi, încă nebifată, nu se consideră ratată — mai ai timp. */
function dailyStreak(h){
  const t = todayIso();
  let n = okDay(h,t) ? 1 : 0, grace=0, consec=0;
  let cur = addDays(t,-1);
  while(cur >= h.creat){
    if(!schedDay(h,cur)){ cur=addDays(cur,-1); continue; }
    if(okDay(h,cur)){ n++; consec=0; }
    else { consec++; if(consec>=2) break; grace++; }
    cur=addDays(cur,-1);
  }
  return {n, grace};
}
function bestDailyStreak(h){
  let best=0, n=0, consec=0, d=h.creat, t=todayIso();
  while(d<=t){
    if(schedDay(h,d)){
      if(okDay(h,d)){ n++; consec=0; if(n>best)best=n; }
      else { consec++; if(consec>=2){ n=0; consec=0; } }
    }
    d=addDays(d,1);
  }
  return best;
}
/* serie săptămânală, aceeași regulă: o săptămână ratată e iertată, două la rând încheie seria.
   Săptămâna curentă, încă neîncheiată, nu se consideră ratată. */
function weeklyStreak(h){
  const cw = weekStart(todayIso());
  const firstW = weekStart(h.creat);
  let n = weekMet(h,cw) ? 1 : 0, grace=0, consec=0;
  let w = addDays(cw,-7);
  while(w >= firstW){
    if(weekMet(h,w)){ n++; consec=0; }
    else { consec++; if(consec>=2) break; grace++; }
    w=addDays(w,-7);
  }
  return {n, grace};
}
function bestWeeklyStreak(h){
  let best=0,n=0,consec=0, w=weekStart(h.creat); const cw=weekStart(todayIso());
  while(w<=cw){
    if(weekMet(h,w)){ n++; consec=0; if(n>best)best=n; }
    else if(w<cw){ consec++; if(consec>=2){ n=0; consec=0; } }
    w=addDays(w,7);
  }
  return best;
}
function streakInfo(h){
  if(isDaily(h)){ const s=dailyStreak(h); return {n:s.n, grace:s.grace, unit:"zile", best:bestDailyStreak(h)}; }
  const s=weeklyStreak(h); return {n:s.n, grace:s.grace, unit:"săpt.", best:bestWeeklyStreak(h)};
}
/* seria e în pericol: ultima zi programată a fost ratată, iar azi e încă nebifat */
function streakAtRisk(h){
  const t=todayIso();
  if(okDay(h,t) || !schedDay(h,t)) return false;
  let y=addDays(t,-1); while(y>=h.creat && !schedDay(h,y)) y=addDays(y,-1);
  return y>=h.creat && !okDay(h,y);
}
/* voturi = totalul zilelor reușite */
function votes(h){
  let n=0, d=h.creat, t=todayIso();
  while(d<=t){ if(okDay(h,d)) n++; d=addDays(d,1); }
  return n;
}
/* puterea obiceiului — netezire exponențială pe ultimele 90 de zile programate */
function strength(h){
  const t=todayIso(); let d=addDays(t,-90); if(d<h.creat) d=h.creat;
  let s=0, k=0.06, any=false;
  while(d<t){ if(schedDay(h,d)){ s = s*(1-k) + (okDay(h,d)?1:0)*k; any=true; } d=addDays(d,1); }
  if(okDay(h,t)) s = s*(1-k)+k;
  return any? Math.round(s*100) : 0;
}
/* never miss twice: ieri programat & ratat & azi încă nebifat (doar obiceiuri zilnice) */
function needsRescue(h){
  if(!isDaily(h)) return false;
  return streakAtRisk(h);
}
const activeHabits = () => S.habits.filter(h=>!h.arhivat);

/* ---------------- praguri de sărbătorit ---------------- */
const MILE_D = [7,30,66,100,180,365];
const MILE_W = [4,8,12,26,52];
function checkMilestone(h){
  const si = streakInfo(h);
  const list = isDaily(h)?MILE_D:MILE_W;
  if(!list.includes(si.n)) return null;
  const key = h.id+":"+si.unit+":"+si.n;
  if(S.settings.celebrated[key]) return null;
  S.settings.celebrated[key]=1; save();
  return {n:si.n, unit:si.unit, h};
}
const MILE_MSG = {
  "7:zile":"O săptămână întreagă. Primul prag real — corpul începe să se aștepte la asta.",
  "30:zile":"O lună. Nu mai e un experiment, e un mod de viață.",
  "66:zile":"66 de zile — media științifică pentru formarea unui obicei (studiul Lally, UCL). De aici încolo merge mai mult de la sine.",
  "100:zile":"100 de zile. Ești în top 1% al oamenilor care încep un obicei.",
  "180:zile":"Jumătate de an. Identitatea nu mai e o intenție, e un fapt.",
  "365:zile":"Un an întreg. Asta nu se mai numește obicei — ești tu.",
  "4:săpt.":"O lună de săptămâni reușite. Sistemul funcționează.",
  "8:săpt.":"Două luni de constanță săptămânală.",
  "12:săpt.":"Un trimestru întreg. Ritmul e instalat.",
  "26:săpt.":"Jumătate de an de săptămâni câștigate.",
  "52:săpt.":"Un an de săptămâni reușite. Remarcabil."
};

/* ---------------- ecran & navigație ---------------- */
let scr="azi", viewDate=todayIso(), rapMode="sapt", rapAnchor=todayIso();
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

document.querySelectorAll("nav#tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    scr=b.dataset.s;
    $$("nav#tabs button").forEach(x=>x.classList.toggle("on",x===b));
    $$(".screen").forEach(x=>x.classList.remove("on"));
    $("#scr-"+scr).classList.add("on");
    $("#datenav").style.display = scr==="azi"?"":"none";
    $("#todaychip").style.display = (scr==="azi" && viewDate!==todayIso())?"block":"none";
    render();
    window.scrollTo({top:0});
  });
});
document.querySelectorAll("#aboseg button").forEach(b=>b.addEventListener("click",()=>{
  aboMode=b.dataset.m; aboAnchor=todayIso(); renderAbo(); window.scrollTo({top:0});
}));
$("#dPrev").addEventListener("click",()=>{ viewDate=addDays(viewDate,-1); renderAzi(); });
$("#dNext").addEventListener("click",()=>{ if(viewDate<todayIso()){ viewDate=addDays(viewDate,1); renderAzi(); } });
$("#dToday").addEventListener("click",()=>{ viewDate=todayIso(); renderAzi(); });

/* ---------------- toast & celebrare ---------------- */
let toastT;
function toast(msg){
  const t=$("#toast"); t.innerHTML=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}
function celebrate(m){
  celebrateFree(m.n+" "+(m.unit==="zile"?"zile":"săptămâni")+" — "+m.h.nume, m.n,
    MILE_MSG[m.n+":"+m.unit] || "Continuă tot așa.");
}
function celebrateFree(titlu, mare, text){
  $("#celeN").textContent = mare;
  $("#celeT").textContent = titlu;
  $("#celeP").textContent = text;
  $("#cele").classList.add("show");
  if(navigator.vibrate) navigator.vibrate([40,60,40]);
}
$("#celeOk").addEventListener("click",()=>$("#cele").classList.remove("show"));

/* ---------------- AZI ---------------- */
function renderAzi(){
  const t=todayIso(), isToday=viewDate===t;
  $("#dTitle").textContent = isToday ? "Azi" : (viewDate===addDays(t,-1)?"Ieri":fmtDate(viewDate));
  $("#dSub").textContent = isToday||viewDate===addDays(t,-1) ? fmtDate(viewDate) : "";
  $("#dNext").disabled = isToday;
  $("#todaychip").style.display = (!isToday && scr==="azi") ? "block":"none";

  // onboarding
  const onb=$("#onb");
  if(!S.settings.onboarded){
    onb.innerHTML = `<div class="onb"><h2>Fiecare bifă e un vot</h2>
      <p>„Fiecare acțiune e un <b>vot pentru tipul de om care vrei să devii</b>.” — James Clear, <i>Atomic Habits</i>.</p>
      <p>Un obicei se formează în medie în <b>66 de zile</b> (între 18 și 254 — studiul Lally, UCL). O zi ratată <b>nu strică nimic</b>; regula e una singură: <b>nu rata de două ori la rând</b>.</p>
      <p>Primele săptămâni contează cel mai mult. Bifează imediat după ce faci obiceiul.</p>
      <button id="onbOk">Am înțeles — încep</button></div>`;
    $("#onbOk").addEventListener("click",()=>{ S.settings.onboarded=true; save(); renderAzi(); });
  } else onb.innerHTML="";

  // alertă abonamente (doar pe ziua curentă)
  renderAboAlert(isToday);

  // bara de voturi
  const hs = activeHabits();
  const doneToday = hs.filter(h=>okDay(h,viewDate)).length;
  const schedToday = hs.filter(h=>schedDay(h,viewDate)).length;
  const ramase = schedToday-doneToday;
  const totalVotes = hs.reduce((a,h)=>a+votes(h),0);
  const incurajare = schedToday===0 ? "zi liberă" :
    ramase===0 ? "zi completă — toate bifate" :
    doneToday===0 ? "prima bifă e cea mai grea" :
    ramase===1 ? "a mai rămas una singură" : `au mai rămas ${ramase}`;
  $("#votebar").innerHTML = `<div style="flex:1"><div class="n num">${doneToday}<span style="font-size:15px;color:var(--ink2)">/${schedToday}</span></div>
    <div class="t">voturi ${isToday?"azi":"în această zi"} · ${incurajare}</div>
    <div class="vbar"><i style="width:${schedToday?Math.round(doneToday/schedToday*100):0}%"></i></div></div>
    <div style="text-align:right;padding-left:12px"><div class="n num" style="font-size:19px">${totalVotes}</div><div class="t">voturi în total,<br>pentru cine devii</div></div>`;

  // lista — întâi ce e de făcut, la urmă ce e deja bifat
  const list=$("#hlist"); list.innerHTML="";
  const rank = h => !schedDay(h,viewDate) ? 2 : (okDay(h,viewDate) ? 1 : 0);
  const ordonate = hs.map((h,i)=>({h,i})).sort((a,b)=> rank(a.h)-rank(b.h) || a.i-b.i).map(x=>x.h);
  let ultimRank=-1;
  ordonate.forEach(h=>{
    const r=rank(h);
    if(r!==ultimRank && r>0 && ordonate.some(x=>rank(x)<r)){
      const sep=document.createElement("div"); sep.className="listsep";
      sep.textContent = r===1 ? "Făcute azi" : "În afara programului";
      list.appendChild(sep);
    }
    ultimRank=r;
    const off = !schedDay(h,viewDate);
    const done = okDay(h,viewDate);
    const si = streakInfo(h);
    const card=document.createElement("div");
    card.className="hcard"+(done?" done":"")+(off?" offday":"");
    card.style.setProperty("--hc",h.culoare);

    let meta="";
    if(isDaily(h)){
      meta += `<span class="pill ${si.n>0?'hot':''} num">serie: ${si.n} ${si.unit}</span>`;
      if(streakAtRisk(h) && si.n>0) meta += `<span class="pill warn">ziua liberă e folosită</span>`;
      else if(si.grace>0) meta += `<span class="pill num" title="zile ratate iertate în seria curentă">${si.grace} ${si.grace===1?"zi liberă":"zile libere"}</span>`;
    } else {
      const ws=weekStart(viewDate), hits=weekHits(h,ws);
      const dots = Array.from({length:h.perWeek},(_,i)=>`<i class="${i<hits?'on':''}"></i>`).join("");
      const wd = weekDays(ws,h);
      const remaining = wd.filter(d=>d>=viewDate).length;
      meta += `<span class="pill num wkdots-wrap" style="display:flex;align-items:center;gap:7px">săpt: ${hits}/${h.perWeek} <span class="wkdots">${dots}</span></span>`;
      if(si.n>0) meta += `<span class="pill hot num">serie: ${si.n} ${si.unit}</span>`;
      if(hits<h.perWeek && remaining>0 && remaining <= (h.perWeek-hits)) meta += `<span class="pill warn">ultimele zile din săptămână</span>`;
    }
    meta += `<span class="pill num">${votes(h)} voturi</span>`;

    if(isNum(h)){
      const somn = h.tip==="somn";
      const doneWord = somn ? "dormite" : "lucrate";
      const t0 = h.tintaOre;
      const chipVals = somn ? [6,6.5,7,7.5,8] : [t0/2,t0*0.75,t0,t0+0.5,t0+1].map(x=>Math.round(x*4)/4).filter((x,i,a)=>x>0&&a.indexOf(x)===i);
      const v = val(h,viewDate);
      const shown = v!=null? v : (val(h,addDays(viewDate,-1)) ?? h.tintaOre);
      const avg = sleepWeekAvg(h, weekStart(viewDate));
      card.innerHTML = `<div class="stripe"></div>
        <div class="hbody">
          <div class="hname">${esc(h.nume)}</div>
          <div class="hcue">${esc(h.cue||"")}</div>
          <div class="sleepctl">
            <button class="stepper" data-a="-">−</button>
            <div class="val num">${v!=null?fmtH(v):"—"} <small>${v!=null?doneWord:"nescris"}</small></div>
            <button class="stepper" data-a="+">+</button>
            <button class="stepper" style="width:auto;padding:0 12px;font-size:13px;color:${v!=null&&v>=h.tintaOre?"var(--hc)":"var(--ink3)"}">${v!=null? (v>=h.tintaOre?"țintă atinsă":"sub "+fmtH(h.tintaOre)) : "notează"}</button>
          </div>
          <div class="chips">${chipVals.map(x=>`<button data-h="${x}" class="num">${fmtH(x)}</button>`).join("")}</div>
          <div class="hmeta">${meta}${avg!=null?`<span class="pill num">medie săpt: ${fmtH2(avg)}</span>`:""}</div>
          ${needsRescue(h)?rescueHtml(h):""}
        </div>`;
      card.querySelectorAll(".stepper[data-a]").forEach(b=>b.addEventListener("click",()=>{
        const cur = val(h,viewDate); const base = cur!=null?cur:shown;
        setVal(h, viewDate, Math.max(0,Math.min(14, base + (b.dataset.a==="+"?0.25:-0.25))), cur==null);
      }));
      card.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>{
        setVal(h, viewDate, parseFloat(b.dataset.h), val(h,viewDate)==null);
      }));
    } else {
      card.innerHTML = `<div class="stripe"></div>
        <button class="checkbtn" aria-label="Bifează ${esc(h.nume)}" ${off?"disabled":""}>
          <svg viewBox="0 0 52 52"><circle class="ringbg" cx="26" cy="26" r="24"/><circle class="ringfg" cx="26" cy="26" r="24"/></svg>
          <svg class="tick" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
        </button>
        <div class="hbody">
          <div class="hname">${esc(h.nume)}</div>
          <div class="hcue">${esc(h.cue||"")}</div>
          <div class="hmeta">${meta}</div>
          ${off?`<div class="hcue" style="margin-top:6px">doar în zile lucrătoare</div>`:""}
          ${needsRescue(h)?rescueHtml(h):""}
        </div>`;
      const btn = card.querySelector(".checkbtn");
      if(!off) btn.addEventListener("click",()=>toggle(h));
    }
    list.appendChild(card);
  });
}
function rescueHtml(h){
  const si=streakInfo(h);
  if(si.n>0) return `<div class="rescue"><b>Ți-ai folosit ziua liberă ieri — seria de ${si.n} ${si.unit} e încă intactă.</b> Azi o salvezi definitiv; e de-ajuns și varianta de 2 minute.</div>`;
  return `<div class="rescue"><b>Reîncepem azi.</b> O zi ratată nu șterge nimic din ce ai construit — seriile se reiau, munca rămâne. Fă și varianta mică, contează la fel.</div>`;
}
function sleepWeekAvg(h, ws){
  const vals = weekDays(ws,h).map(d=>val(h,d)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toggle(h){
  const d=viewDate, was = okDay(h,d);
  if(was){
    delete S.entries[d][h.id];
    if(!Object.keys(S.entries[d]).length) delete S.entries[d];
    save(); renderAzi(); return;
  }
  if(!S.entries[d]) S.entries[d]={};
  S.entries[d][h.id]=1; save();
  afterDone(h);
}
/* felicitarea imediată — recompensa care face bifa să merite (legea 4) */
function afterDone(h, prefix){
  if(navigator.vibrate) navigator.vibrate(28);
  renderAzi();
  const v=votes(h), si=streakInfo(h);
  const ident=esc(h.identitate||"omul care își ține promisiunile");
  const pool = h.negativ
    ? [`Zi curată. Votul #${v} pentru: <b>${ident}</b>.`,
       `Ai rezistat — încă un vot pentru <b>${ident}</b>. Al ${v}-lea.`,
       `Bravo. Fiecare zi ca asta întărește <b>${ident}</b>.`]
    : [`Felicitări — votul #${v} pentru: <b>${ident}</b>.`,
       `Bifat. Așa arată <b>${ident}</b> — al ${v}-lea vot.`,
       `Bravo! Încă un vot pentru <b>${ident}</b> (#${v}).`];
  if(si.n>=3) pool.push(`Felicitări — serie de <b>${si.n} ${si.unit==="zile"?"zile":"săptămâni"}</b>. Ții ritmul.`);
  toast((prefix?prefix+" ":"")+pool[v%pool.length]);
  const m=checkMilestone(h);
  if(m){ setTimeout(()=>celebrate(m),700); return; }
  // zi completă: toate obiceiurile programate azi sunt bifate
  if(viewDate===todayIso()){
    const hs=activeHabits().filter(x=>schedDay(x,viewDate));
    if(hs.length>1 && hs.every(x=>okDay(x,viewDate))){
      const key="perfect:"+viewDate;
      if(!S.settings.celebrated[key]){
        S.settings.celebrated[key]=1; save(false);
        setTimeout(()=>celebrateFree("Zi completă","✓","Toate obiceiurile de azi, bifate. Zilele ca asta sunt cele care compun identitatea — nu cele mari și rare."),700);
      }
    }
  }
}
function setVal(h,d,v,firstSet){
  if(!S.entries[d]) S.entries[d]={};
  S.entries[d][h.id]=Math.round(v*100)/100; save();
  if(firstSet && v>=h.tintaOre) afterDone(h, `${fmtH(v)} ${h.tip==="somn"?"dormite":"lucrate"} —`);
  else renderAzi();
}

/* ---------------- RAPOARTE ---------------- */
$$("#rapseg button").forEach(b=>b.addEventListener("click",()=>{
  rapMode=b.dataset.p;
  $$("#rapseg button").forEach(x=>x.classList.toggle("on",x===b));
  rapAnchor=todayIso(); renderRap();
}));
$("#rPrev").addEventListener("click",()=>{ rapAnchor=shiftPeriod(rapAnchor,-1); renderRap(); });
$("#rNext").addEventListener("click",()=>{ const n=shiftPeriod(rapAnchor,1); if(startOfPeriod(n)<=todayIso()) { rapAnchor=n; renderRap(); } });

function shiftPeriod(a,dir){
  if(rapMode==="sapt") return addDays(a,7*dir);
  const d=fromIso(a);
  if(rapMode==="luna"){ d.setDate(1); d.setMonth(d.getMonth()+dir); return iso(d); }
  d.setMonth(0); d.setDate(1); d.setFullYear(d.getFullYear()+dir); return iso(d);
}
function startOfPeriod(a){
  if(rapMode==="sapt") return weekStart(a);
  const d=fromIso(a);
  if(rapMode==="luna"){ d.setDate(1); return iso(d); }
  d.setMonth(0); d.setDate(1); return iso(d);
}
function endOfPeriod(a){
  if(rapMode==="sapt") return addDays(weekStart(a),6);
  const d=fromIso(a);
  if(rapMode==="luna"){ d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); }
  d.setMonth(11); d.setDate(31); return iso(d);
}

function renderRap(){
  const s=startOfPeriod(rapAnchor), e=endOfPeriod(rapAnchor);
  const t=todayIso();
  let title;
  if(rapMode==="sapt"){
    const a=fromIso(s), b=fromIso(e);
    title = a.getDate()+" "+(a.getMonth()===b.getMonth()?"":LUNA[a.getMonth()].slice(0,3)+" ")+"– "+b.getDate()+" "+LUNA[b.getMonth()]+" "+b.getFullYear();
    if(weekStart(t)===s) title = "Săptămâna curentă";
  } else if(rapMode==="luna"){
    const d=fromIso(s); title = LUNA[d.getMonth()][0].toUpperCase()+LUNA[d.getMonth()].slice(1)+" "+d.getFullYear();
  } else title = "Anul "+fromIso(s).getFullYear();
  $("#rapTitle").textContent=title;
  $("#rNext").disabled = startOfPeriod(shiftPeriod(rapAnchor,1))>t;

  const body=$("#rapbody"); body.innerHTML="";
  const hs=activeHabits();
  if(!hs.length){ body.innerHTML=`<div class="empty">Niciun obicei activ.</div>`; return; }

  if(rapMode==="sapt") renderRapSapt(body,s,hs);
  else if(rapMode==="luna") renderRapLuna(body,s,e,hs);
  else renderRapAn(body,s,e,hs);
}

/* --- raport SĂPTĂMÂNĂ --- */
function renderRapSapt(body,ws,hs){
  const t=todayIso();
  let met=0, poss=0;
  hs.forEach(h=>{ poss++; if(weekMet(h,ws)) met++; });
  const kp=document.createElement("div"); kp.className="kpis";
  const totV = hs.reduce((a,h)=>a+weekHits(h,ws),0);
  kp.innerHTML = `
    <div class="kpi"><div class="v num" style="color:var(--accent)">${met}/${poss}</div><div class="l">obiceiuri cu ținta săptămânii atinsă</div></div>
    <div class="kpi"><div class="v num">${totV}</div><div class="l">voturi în această săptămână</div></div>`;
  body.appendChild(kp);

  hs.forEach(h=>{
    const wd=weekDays(ws,h), hits=weekHits(h,ws);
    const pct=Math.min(100,Math.round(hits/h.perWeek*100));
    const card=document.createElement("div"); card.className="card"; card.style.setProperty("--hc",h.culoare);
    let extra="";
    if(isNum(h)){
      const avg=sleepWeekAvg(h,ws);
      const tot=weekDays(ws,h).map(d=>val(h,d)).filter(v=>v!=null).reduce((a,b)=>a+b,0);
      extra = `<div class="statrow"><span>${h.tip==="somn"?"media orelor dormite":"total ore în săptămână"}</span><b class="num">${h.tip==="somn" ? (avg!=null?fmtH2(avg):"—") : fmtH2(tot)}</b></div>`;
    }
    const si=streakInfo(h);
    const days = wd.map(d=>{
      const cls = d>t?"":okDay(h,d)?"p3":(logged(h,d)||d<t?"miss":"");
      return `<span title="${d}" style="width:22px;height:22px;border-radius:6px;display:inline-block;background:${d>t?"var(--raised)":cls==="p3"?h.culoare:"#2E2A25"};outline:${d===t?"1.5px solid var(--ink2)":"none"};outline-offset:1px"></span>`;
    }).join("");
    card.innerHTML = `<h3><span class="dot"></span>${esc(h.nume)}</h3>
      <div class="sub">${esc(h.identitate)} · țintă ${h.perWeek}/${wd.length}${h.lucratoare?" (zile lucrătoare)":""}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="statrow"><span class="num">${hits} din ${h.perWeek} · ${pct}%</span><span style="display:flex;gap:5px">${days}</span></div>
      ${extra}
      <div class="statrow"><span>serie curentă</span><b class="num">${si.n} ${si.unit}</b></div>
      <div class="statrow"><span>puterea obiceiului (ultimele 90 zile)</span><b class="num">${strength(h)}%</b></div>`;
    body.appendChild(card);
  });
}

/* --- raport LUNĂ --- */
function renderRapLuna(body,ms,me,hs){
  const t=todayIso();
  // KPI-uri lună
  let totV=0, weeksMet=0, weeksTot=0;
  hs.forEach(h=>{
    let d=ms; while(d<=me){ if(okDay(h,d)) totV++; d=addDays(d,1); }
    let w=weekStart(ms)>=ms?weekStart(ms):weekStart(addDays(ms,6));
    w=weekStart(ms); if(w<ms) w=addDays(w,7);
    while(addDays(w,6)<=me){ if(addDays(w,6)<=t){ weeksTot++; if(weekMet(h,w)) weeksMet++; } w=addDays(w,7); }
  });
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`
    <div class="kpi"><div class="v num" style="color:var(--accent)">${totV}</div><div class="l">voturi în această lună</div></div>
    <div class="kpi"><div class="v num">${weeksTot?Math.round(weeksMet/weeksTot*100):0}%</div><div class="l">din săptămânile încheiate au ținta atinsă</div></div>`;
  body.appendChild(kp);

  hs.forEach(h=>{
    const card=document.createElement("div"); card.className="card"; card.style.setProperty("--hc",h.culoare);
    card.innerHTML=`<h3><span class="dot"></span>${esc(h.nume)}</h3><div class="sub">${esc(h.identitate)}</div>`;
    card.appendChild(heatGrid(h, ms, me));
    if(isNum(h)){
      card.appendChild(sleepChart(h, ms, me));
      const p2=Math.round(h.tintaOre*0.75*4)/4;
      const lg=document.createElement("div"); lg.className="heatlbl";
      lg.innerHTML=`<span><span class="sw" style="background:color-mix(in srgb,${h.culoare} 35%,var(--raised))"></span>&lt;${fmtH(p2)}</span>
        <span><span class="sw" style="background:color-mix(in srgb,${h.culoare} 65%,var(--raised))"></span>${fmtH(p2)}–${fmtH(h.tintaOre)}</span>
        <span><span class="sw" style="background:${h.culoare}"></span>≥${fmtH(h.tintaOre)}</span>
        <span><span class="sw" style="background:#2E2A25"></span>nescris</span>`;
      card.appendChild(lg);
    } else {
      const lg=document.createElement("div"); lg.className="heatlbl";
      lg.innerHTML=`<span><span class="sw" style="background:${h.culoare}"></span>${h.negativ?"zi curată":"făcut"}</span>
        <span><span class="sw" style="background:#2E2A25"></span>ratat</span>
        ${h.lucratoare?'<span><span class="sw" style="border:1px dashed #2A2825;background:transparent"></span>weekend</span>':""}`;
      card.appendChild(lg);
    }
    body.appendChild(card);
  });

  // tipar pe zilele săptămânii
  const dowCard=document.createElement("div"); dowCard.className="card";
  dowCard.innerHTML=`<h3>Tiparul săptămânii</h3><div class="sub">procent de reușite pe fiecare zi, toate obiceiurile, luna curentă</div>`;
  const wrap=document.createElement("div"); wrap.className="dow";
  const pct=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  let d=ms;
  while(d<=me && d<=t){
    const k=dow(d);
    hs.forEach(h=>{ if(schedDay(h,d)){ cnt[k]++; if(okDay(h,d)) pct[k]++; } });
    d=addDays(d,1);
  }
  let worst=-1, worstP=101;
  for(let i=0;i<7;i++){
    const p=cnt[i]?Math.round(pct[i]/cnt[i]*100):null;
    if(p!=null && p<worstP && cnt[i]>=10){ worstP=p; worst=i; }
    wrap.innerHTML+=`<div class="b"><span class="pv num">${p==null?"–":p+"%"}</span><span class="bar" style="height:${p==null?2:Math.max(3,p*0.7)}px"></span><span class="lb">${ZIS[i]}</span></div>`;
  }
  dowCard.appendChild(wrap);
  if(worst>=0 && worstP<70){
    const co=document.createElement("div"); co.className="callout";
    const zi=["lunea","marțea","miercurea","joia","vinerea","sâmbăta","duminica"][worst];
    co.innerHTML=`Cele mai multe ratări sunt <b>${zi}</b> (${worstP}% reușite). Gândește-te ce e diferit în ziua aceea — și pregătește indiciul de seara: geanta, caserola, lecția deschisă.`;
    dowCard.appendChild(co);
  }
  body.appendChild(dowCard);
}

function heatGrid(h, from, to){
  // coloane = săptămâni (luni→duminică), rânduri = zile
  const t=todayIso();
  const grid=document.createElement("div"); grid.className="heat";
  let w=weekStart(from);
  while(w<=to){
    const col=document.createElement("div"); col.className="col";
    for(let i=0;i<7;i++){
      const d=addDays(w,i);
      const c=document.createElement("span"); c.className="cell";
      if(d<from||d>to){ c.style.visibility="hidden"; }
      else if(!schedDay(h,d)) c.classList.add("off");
      else if(d>t || d<h.creat) {/* viitor sau înainte de start: neutru */}
      else if(isNum(h)){
        const v=val(h,d);
        if(v==null) c.classList.add("miss");
        else c.classList.add(v>=h.tintaOre?"p3":v>=h.tintaOre*0.75?"p2":"p1");
      }
      else if(okDay(h,d)) c.classList.add("p3");
      else c.classList.add("miss");
      if(d===t) c.classList.add("today");
      c.title=d;
      col.appendChild(c);
    }
    grid.appendChild(col); w=addDays(w,7);
  }
  requestAnimationFrame(()=>{ grid.scrollLeft = grid.scrollWidth; });
  return grid;
}

/* grafic linie somn (SVG) */
function sleepChart(h, from, to){
  const t=todayIso();
  const pts=[]; let d=from;
  while(d<=to && d<=t){ const v=val(h,d); if(v!=null) pts.push({d,v}); d=addDays(d,1); }
  const wrap=document.createElementNS("http://www.w3.org/2000/svg","svg");
  wrap.setAttribute("class","chart"); wrap.setAttribute("viewBox","0 0 340 120");
  const days = Math.round((fromIso(to)-fromIso(from))/864e5)+1;
  const X = s => 8 + (Math.round((fromIso(s)-fromIso(from))/864e5))/(days-1) * 324;
  const maxV = pts.length? Math.max(...pts.map(p=>p.v)) : h.tintaOre;
  const lo = h.tip==="somn"?4:0, hi = h.tip==="somn"?10:Math.max(h.tintaOre*2, Math.ceil(maxV+1));
  const Y = v => 108 - (Math.min(hi,Math.max(lo,v))-lo)/(hi-lo)*96;
  let g=`<line x1="8" y1="${Y(h.tintaOre)}" x2="332" y2="${Y(h.tintaOre)}" stroke="#3A311F" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="332" y="${Y(h.tintaOre)-4}" text-anchor="end" font-size="9" fill="#6E675D" font-family="Karla,sans-serif">țintă ${fmtH(h.tintaOre)}</text>`;
  if(pts.length>=2){
    const line = pts.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
    const area = line+` L${X(pts[pts.length-1].d).toFixed(1)} 108 L${X(pts[0].d).toFixed(1)} 108 Z`;
    g+=`<path d="${area}" fill="${h.culoare}" opacity="0.12"/>
        <path d="${line}" fill="none" stroke="${h.culoare}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{
    const last=i===pts.length-1;
    g+=`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?3.5:2}" fill="${last?h.culoare:"#1D1B19"}" stroke="${h.culoare}" stroke-width="1.5"><title>${p.d}: ${fmtH(p.v)}</title></circle>`;
    if(last) g+=`<text x="${Math.max(24,Math.min(316,X(p.d))).toFixed(1)}" y="${(Y(p.v)-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#EDE7DD" font-family="Karla,sans-serif">${fmtH(p.v)}</text>`;
  });
  if(!pts.length) g+=`<text x="170" y="60" text-anchor="middle" font-size="11" fill="#6E675D" font-family="Karla,sans-serif">nicio înregistrare încă</text>`;
  wrap.innerHTML=g;
  return wrap;
}

/* --- raport AN --- */
function renderRapAn(body,ys,ye,hs){
  const t=todayIso();
  let totV=0; const perH=[];
  hs.forEach(h=>{
    let n=0,d=ys; while(d<=ye&&d<=t){ if(okDay(h,d)) n++; d=addDays(d,1); }
    totV+=n; perH.push(n);
  });
  const sleepH = hs.find(h=>h.tip==="somn");
  let sleepTot=0, sleepCnt=0;
  if(sleepH){ let d=ys; while(d<=ye&&d<=t){ const v=val(sleepH,d); if(v!=null){sleepTot+=v;sleepCnt++;} d=addDays(d,1);} }
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`
    <div class="kpi"><div class="v num" style="color:var(--accent)">${totV}</div><div class="l">voturi în acest an</div></div>
    <div class="kpi"><div class="v num">${sleepCnt?fmtH2(sleepTot/sleepCnt):"—"}</div><div class="l">media somnului pe an</div></div>`;
  body.appendChild(kp);

  hs.forEach((h,i)=>{
    const card=document.createElement("div"); card.className="card"; card.style.setProperty("--hc",h.culoare);
    const si=streakInfo(h);
    card.innerHTML=`<h3><span class="dot"></span>${esc(h.nume)}</h3>
      <div class="sub num">${perH[i]} voturi · cea mai lungă serie: ${si.best} ${si.unit}</div>`;
    card.appendChild(heatGrid(h, ys, ye));
    body.appendChild(card);
  });

  const note=document.createElement("div"); note.className="callout"; 
  note.innerHTML=`<b>Platoul potențialului latent:</b> munca nu se pierde, se acumulează. Fiecare vot e depozitat — chiar și atunci când rezultatele nu se văd încă.`;
  body.appendChild(note);
}

function exportJson(){
  const cp=JSON.parse(JSON.stringify(S));
  if(cp.settings){ delete cp.settings.ghToken; delete cp.settings.gistId; delete cp.settings.syncOn; }
  const data=JSON.stringify(cp,null,1);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="atomic-gvd-backup-"+todayIso().replace(/-/g,"")+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Backup descărcat. Păstrează-l la loc sigur.");
}
function importJson(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change",()=>{
    const file=inp.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.habits)||typeof d.entries!=="object") throw 0;
        S=d; if(!S.settings) S.settings={notifOn:false,notifAm:"07:30",notifPm:"21:30",onboarded:true,celebrated:{},lastNotif:{}};
        if(!S.meta) S.meta={updatedAt:Date.now()}; if(!S.deleted) S.deleted=[];
        save(); render();
        toast("Istoric importat: "+d.habits.length+" obiceiuri, "+Object.keys(d.entries).length+" zile.");
      }catch(e){ toast("Fișier invalid — alege un backup Atomic GVD (.json)."); }
    };
    r.readAsText(file);
  });
  inp.click();
}

/* ---------------- sincronizare prin GitHub Gist ---------------- */
const GIST_DESC="atomic-gvd-sync", GIST_FILE="atomic-gvd.json";
let syncTimer=null, syncBusy=false;
const ghHeaders = () => ({ "Authorization":"Bearer "+S.settings.ghToken, "Accept":"application/vnd.github+json" });

function syncPayload(){
  const cp=JSON.parse(JSON.stringify(S));
  if(cp.settings){ delete cp.settings.ghToken; delete cp.settings.gistId; delete cp.settings.syncOn; delete cp.settings.lastSyncAt; delete cp.settings.lastNotif; }
  return JSON.stringify(cp);
}
function scheduleSync(){
  if(!S.settings.syncOn) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncNow(false), 4000);
}
async function syncConnect(tok){
  // caută gist-ul existent sau creează unul secret
  const r=await fetch("https://api.github.com/gists?per_page=100",{headers:{ "Authorization":"Bearer "+tok, "Accept":"application/vnd.github+json" }});
  if(r.status===401) throw new Error("token invalid sau expirat");
  if(!r.ok) throw new Error("GitHub a răspuns cu eroarea "+r.status);
  const list=await r.json();
  let g=list.find(x=>x.description===GIST_DESC && x.files && x.files[GIST_FILE]);
  S.settings.ghToken=tok;
  if(!g){
    const c=await fetch("https://api.github.com/gists",{method:"POST",headers:{ "Authorization":"Bearer "+tok, "Accept":"application/vnd.github+json" },
      body:JSON.stringify({description:GIST_DESC, public:false, files:{[GIST_FILE]:{content:syncPayload()}}})});
    if(!c.ok) throw new Error("nu am putut crea spațiul de sincronizare ("+c.status+")");
    g=await c.json();
  }
  S.settings.gistId=g.id;
  S.settings.syncOn=true;
  save(false);
  await syncNow(true);
}
function mergeStates(a,b){
  const an=a.meta?.updatedAt||0, bn=b.meta?.updatedAt||0;
  const newer=an>=bn?a:b, older=an>=bn?b:a;
  const del=[...new Set([...(a.deleted||[]),...(b.deleted||[])])];
  // abonamente: cel mai recent dispozitiv câștigă pe fiecare abonament; ștergerile se propagă
  const sdel=[...new Set([...(a.subsDeleted||[]),...(b.subsDeleted||[])])];
  const sids=[...new Set([...((newer.subs)||[]).map(s=>s.id),...((older.subs)||[]).map(s=>s.id)])];
  const subs=[];
  sids.forEach(id=>{ if(sdel.includes(id)) return;
    const sn=(newer.subs||[]).find(s=>s.id===id), so=(older.subs||[]).find(s=>s.id===id);
    subs.push(sn||so);
  });
  const ids=[...new Set([...(newer.habits||[]).map(h=>h.id),...(older.habits||[]).map(h=>h.id)])];
  const habits=[];
  ids.forEach(id=>{
    if(del.includes(id)) return;
    const hn=(newer.habits||[]).find(h=>h.id===id), ho=(older.habits||[]).find(h=>h.id===id);
    habits.push(hn||ho);
  });
  const entries={};
  [...new Set([...Object.keys(a.entries||{}),...Object.keys(b.entries||{})])].forEach(d=>{
    entries[d]={...(older.entries?.[d]||{}),...(newer.entries?.[d]||{})};
    del.forEach(id=>delete entries[d][id]);
    if(!Object.keys(entries[d]).length) delete entries[d];
  });
  const settings={...older.settings,...newer.settings,
    celebrated:{...(older.settings?.celebrated||{}),...(newer.settings?.celebrated||{})},
    categorii:[...new Set([...(older.settings?.categorii||[]),...(newer.settings?.categorii||[])])],
    titulari:[...new Set([...(older.settings?.titulari||[]),...(newer.settings?.titulari||[])])]};
  // token/gist/notificări rămân cele locale ale acestui dispozitiv
  ["ghToken","gistId","syncOn","lastSyncAt","lastNotif","notifOn","notifAm","notifPm"].forEach(k=>{ if(S.settings[k]!==undefined) settings[k]=S.settings[k]; });
  return {v:1,habits,entries,settings,subs,subsDeleted:sdel,deleted:del,meta:{updatedAt:Math.max(an,bn)}};
}
async function syncNow(manual){
  const st=S.settings;
  if(!st.syncOn||!st.ghToken||!st.gistId||syncBusy) return;
  syncBusy=true;
  const stat=document.getElementById("s-syncstat");
  if(stat&&manual) stat.textContent="Sincronizez…";
  try{
    const r=await fetch("https://api.github.com/gists/"+st.gistId,{headers:ghHeaders()});
    if(r.status===404){ st.gistId=""; syncBusy=false; return syncConnect(st.ghToken); }
    if(!r.ok) throw new Error("GitHub "+r.status);
    const g=await r.json();
    let remote={};
    try{ remote=JSON.parse(g.files[GIST_FILE].content); }catch(e){ remote=S; }
    const merged=mergeStates(S,remote);
    S=merged; save(false);
    const p=await fetch("https://api.github.com/gists/"+st.gistId,{method:"PATCH",headers:ghHeaders(),
      body:JSON.stringify({files:{[GIST_FILE]:{content:syncPayload()}}})});
    if(!p.ok) throw new Error("GitHub "+p.status);
    st.lastSyncAt=Date.now(); save(false);
    if(scr==="set") renderSet(); else render();
    if(manual) toast("Sincronizat.");
  }catch(e){
    if(stat) stat.textContent="Eroare de sincronizare: "+(e.message||"fără internet?");
    if(manual) toast("Nu am putut sincroniza — verifică internetul sau token-ul.");
  }
  syncBusy=false;
}
window.addEventListener("online",()=>syncNow(false));

/* ================================================================
   ABONAMENTE
   ================================================================ */
const REC_TXT = {zile:"zile", luni:"luni", ani:"ani"};
function addPeriod(d, tip, n){
  const x=fromIso(d);
  if(tip==="zile") x.setDate(x.getDate()+n);
  else if(tip==="luni"){ const zi=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); x.setDate(Math.min(zi, new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); }
  else if(tip==="ani"){ const zi=x.getDate(); x.setDate(1); x.setFullYear(x.getFullYear()+n); x.setDate(Math.min(zi, new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); }
  return iso(x);
}
/* perioada curentă (sau prima, dacă începe în viitor) */
function subPeriod(s){
  if(s.recTip==="unic") return {start:s.start, end:s.start};
  const t=todayIso();
  let a=s.start, b=addPeriod(a,s.recTip,s.recN), g=0;
  if(a>t) return {start:a,end:b};
  while(b<=t && g++<1200){ a=b; b=addPeriod(a,s.recTip,s.recN); }
  return {start:a,end:b};
}
const zileRamase = s => Math.round((fromIso(subPeriod(s).end)-fromIso(todayIso()))/864e5);
function subStatus(s){
  if(!s.activ) return {k:"off", txt:"inactiv"};
  const p=subPeriod(s), t=todayIso();
  if(p.start>t) return {k:"soon", txt:"începe pe "+fmtShort(p.start)};
  const z=zileRamase(s);
  if(s.recTip==="unic") return {k:"ok", txt:"plată unică"};
  if(z<0) return {k:"late", txt:"expirat de "+(-z)+" zile"};
  if(z<=7) return {k:"warn", txt:(s.auto?"se reînnoiește":"expiră")+(z===0?" azi":z===1?" mâine":" în "+z+" zile")};
  return {k:"ok", txt:(s.auto?"reînnoire":"expiră")+" în "+z+" zile"};
}
const fmtShort = d => { const x=fromIso(d); return x.getDate()+" "+LUNA[x.getMonth()].slice(0,3)+(x.getFullYear()!==new Date().getFullYear()?" "+x.getFullYear():""); };
const curs = () => S.settings.curs||CURS_DEF;
const subRON = s => s.moneda==="RON" ? s.pret : s.pret*curs();
const subEUR = s => s.moneda==="EUR" ? s.pret : s.pret/curs();
const fmtRON = v => (Math.round(v*100)/100).toLocaleString("ro-RO",{minimumFractionDigits:0,maximumFractionDigits:2})+" lei";
const fmtEUR = v => (Math.round(v*100)/100).toLocaleString("ro-RO",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";
function periodMonths(s){
  if(s.recTip==="zile") return s.recN/30.4375;
  if(s.recTip==="luni") return s.recN;
  if(s.recTip==="ani")  return s.recN*12;
  return 0;
}
const lunarRON = s => periodMonths(s)>0 ? subRON(s)/periodMonths(s) : 0;
const anualRON = s => lunarRON(s)*12;
/* datele de plată dintr-un interval */
function platiIntre(s, from, to){
  const out=[];
  if(s.recTip==="unic"){ if(s.start>=from && s.start<=to) out.push(s.start); return out; }
  let d=s.start, g=0;
  while(d<=to && g++<3000){ if(d>=from) out.push(d); d=addPeriod(d,s.recTip,s.recN); }
  return out;
}
const subsActive = () => (S.subs||[]).filter(s=>s.activ!==false);
function recTxt(s){
  if(s.recTip==="unic") return "plată unică";
  if(s.recTip==="ani"  && s.recN===1) return "anual";
  if(s.recTip==="luni" && s.recN===1) return "lunar";
  if(s.recTip==="zile") return "la "+s.recN+" zile";
  return "la "+s.recN+" "+REC_TXT[s.recTip];
}

const aboFiltrate = () => subsActive().filter(s=>(!aboFiltCat||s.categorie===aboFiltCat)&&(!aboFiltTit||s.titular===aboFiltTit));

        ${done?`<div class="sdates">${(s.sesiuni||[]).map(d=>fmtShort(d)).join(" · ")}</div>`:""}</div>`;

    c.innerHTML=`
      <div class="shead">
        <div><div class="sname">${esc(s.nume)}</div>
          <div class="stags"><span class="tag">${esc(s.categorie||"—")}</span><span class="tag t2">${esc(s.titular||"—")}</span>${s.auto?`<span class="tag t3">reînnoire automată</span>`:""}</div>
        </div>
        <button class="sedit" aria-label="Modifică ${esc(s.nume)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
      </div>

      <div class="srow"><span class="stat ${st.k}">${st.txt}</span><span class="num">${s.recTip!=="unic"?"≈ "+fmtRON(lunarRON(s))+"/lună":""}</span></div>

      ${s.obs?`<div class="sobs">${esc(s.obs)}</div>`:""}
