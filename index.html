<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141312">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Atomic GVD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap&subset=latin-ext">
<style>
/* ============ TOKENS — temă dark unică, aleasă deliberat ============ */
:root{
  --bg:#141312;            /* fundal */
  --surface:#1D1B19;       /* card */
  --raised:#26231F;        /* card ridicat / input */
  --line:#33302B;          /* borduri */
  --ink:#EDE7DD;           /* text principal */
  --ink2:#A89F92;          /* text secundar */
  --ink3:#8A8173;   /* contrast 4,47:1 — era 3,08 */          /* text estompat */
  --accent:#E0A458;        /* chihlimbar — brand */
  --accent-deep:#8A6428;
  --good:#3FA351;
  --danger:#D96A52;
  --r:16px;
  --font-d:'Fraunces',Georgia,serif;
  --font-b:'Karla','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:16px;line-height:1.5;
  min-height:100dvh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
#app{max-width:480px;margin:0 auto;padding:0 16px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ============ HEADER ============ */
header{padding:22px 0 6px}
.brand{display:flex;align-items:baseline;justify-content:space-between}
.brand .logo{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--accent)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.datenav h1{font-size:26px}
.datenav .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.navbtns{display:flex;gap:6px}
.navbtns button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:18px;display:grid;place-items:center}
.navbtns button:disabled{opacity:.35}
.todaychip{margin-top:8px;display:none}
.todaychip button{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* bandă voturi */
.votebar{margin:14px 0 4px;padding:12px 16px;background:linear-gradient(135deg,#221D15,#1D1B19);border:1px solid #3A311F;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center}
.votebar .n{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--accent)}
.votebar .t{font-size:13px;color:var(--ink2);max-width:230px;line-height:1.35}

/* ============ CARDURI OBICEI (Azi) ============ */
.hlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;transition:border-color .25s}
.hcard.done{border-color:color-mix(in srgb,var(--hc) 45%,var(--line))}
.hcard.offday{opacity:.5}
.hcard .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc);opacity:.9}
.checkbtn{flex:none;width:52px;height:52px;position:relative;display:grid;place-items:center}
.checkbtn svg{position:absolute;inset:0;width:52px;height:52px}
.checkbtn .ringbg{fill:none;stroke:var(--line);stroke-width:3}
.checkbtn .ringfg{fill:none;stroke:var(--hc);stroke-width:3;stroke-linecap:round;stroke-dasharray:151;stroke-dashoffset:151;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .45s cubic-bezier(.22,1,.36,1)}
.hcard.done .ringfg{stroke-dashoffset:0}
.checkbtn .tick{position:absolute;inset:auto;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;stroke:var(--hc);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:transform .3s .12s,opacity .3s .12s}
.hcard.done .checkbtn .tick{opacity:1;transform:scale(1)}
.checkbtn .mini{position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;stroke:var(--hc);stroke-width:2.6;fill:none;stroke-linecap:round;opacity:0}
.hcard.partial .checkbtn .mini{opacity:1}
.hcard.partial .ringfg{stroke-dasharray:75 151;stroke-dashoffset:0}

.hbody{flex:1;min-width:0}
.hname{font-weight:700;font-size:16px}
.hcue{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hmeta{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--raised);color:var(--ink2);border:1px solid var(--line)}
.pill.hot{color:var(--hc);border-color:color-mix(in srgb,var(--hc) 40%,transparent)}
.pill.warn{color:var(--accent);border-color:var(--accent-deep)}
.wkdots{display:flex;gap:4px;align-items:center}
.wkdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wkdots i.on{background:var(--hc)}

/* somn */
.sleepctl{display:flex;align-items:center;gap:8px;margin-top:9px}
.sleepctl .stepper{width:42px;height:38px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-weight:700;color:var(--ink2);font-size:15px}
.sleepctl .val{font-family:var(--font-d);font-size:21px;font-weight:600;min-width:78px;text-align:center}
.sleepctl .val small{font-size:13px;color:var(--ink2);font-family:var(--font-b)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{font-size:12.5px;padding:5px 12px;border-radius:99px;background:var(--raised);border:1px solid var(--line);color:var(--ink2)}

/* mesaj salvare (never miss twice) */
.rescue{margin-top:8px;font-size:12.5px;color:var(--accent);background:#221C12;border:1px solid #3A311F;border-radius:10px;padding:8px 10px;line-height:1.4}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(90vw,420px);opacity:0;pointer-events:none;transition:.35s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* celebrare */
#cele{position:fixed;inset:0;background:rgba(10,9,8,.8);backdrop-filter:blur(6px);display:none;place-items:center;z-index:70;padding:24px}
#cele.show{display:grid}
#cele .box{background:var(--surface);border:1px solid #3A311F;border-radius:22px;padding:34px 26px;text-align:center;max-width:340px;animation:pop .5s cubic-bezier(.22,1.4,.36,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#cele .big{font-family:var(--font-d);font-size:52px;font-weight:700;color:var(--accent);line-height:1}
#cele h2{font-size:21px;margin-top:10px}
#cele p{color:var(--ink2);font-size:14px;margin-top:8px}
#cele button{margin-top:20px;background:var(--accent);color:#141312;font-weight:700;padding:11px 26px;border-radius:12px;font-size:15px}

/* ============ RAPOARTE ============ */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.periodnav h2{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--hc);flex:none}
.card .sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.progress{height:8px;background:var(--raised);border-radius:99px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--hc);transition:width .5s}
.statrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px;color:var(--ink2)}
.statrow b{font-family:var(--font-d);font-size:17px;color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--font-d);font-size:26px;font-weight:700}
.kpi .l{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.3}
.heat{display:grid;grid-auto-flow:column;gap:3px;margin-top:12px;justify-content:start;overflow-x:auto;padding-bottom:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat .cell{width:13px;height:13px;border-radius:3.5px;background:var(--raised)}
.heat .cell.off{background:transparent;border:1px dashed #2A2825}
.heat .cell.miss{background:#4A3F36}
.heat .cell.mini{background:color-mix(in srgb,var(--hc) 45%,var(--raised));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 70%,transparent)}
.heat .cell.p1{background:color-mix(in srgb,var(--hc) 35%,var(--raised))}
.heat .cell.p2{background:color-mix(in srgb,var(--hc) 65%,var(--raised))}
.heat .cell.p3{background:var(--hc)}
.heat .cell.today{outline:1.5px solid var(--ink2);outline-offset:1px}
.heatlbl{display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:8px;align-items:center;flex-wrap:wrap}
.heatlbl .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
.dow{display:flex;gap:6px;margin-top:12px;align-items:flex-end;height:90px}
.dow .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.dow .bar{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--accent) 55%,var(--raised));min-height:2px}
.dow .lb{font-size:10.5px;color:var(--ink3)}
.dow .pv{font-size:10.5px;color:var(--ink2)}
.callout{margin-top:12px;font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding:8px 12px;background:var(--raised);border-radius:0 10px 10px 0;line-height:1.45}
.callout b{color:var(--ink)}

/* ============ OBICEIURI (management) ============ */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center}
.mcard .cdot{width:14px;height:14px;border-radius:50%;background:var(--hc);flex:none}
.mcard .mb{flex:1;min-width:0}
.mcard .mn{font-weight:700}
.mcard .mi{font-size:12.5px;color:var(--ink3)}
.mcard .acts{display:flex;gap:4px}
.mcard .acts button{width:38px;height:38px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.addbtn{margin-top:14px;width:100%;padding:14px;border-radius:var(--r);border:1.5px dashed var(--accent-deep);color:var(--accent);font-weight:700;font-size:15px}
.arch-h{margin-top:20px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* modal formular */
#modal{position:fixed;inset:0;background:rgba(10,9,8,.75);backdrop-filter:blur(4px);display:none;z-index:50;overflow-y:auto;padding:20px 0}
#modal.show{display:block}
#modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;max-width:460px;margin:0 auto;padding:22px 18px;width:calc(100% - 24px)}
#modal h2{font-size:20px;margin-bottom:4px}
#modal .note{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.field{margin-top:13px}
.field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.4}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.togglerow{display:flex;justify-content:space-between;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:13px}
.togglerow span{font-size:14px}
.tg{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);transition:.25s;flex:none}
.tg.on{background:var(--accent)}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.25s}
.tg.on i{left:23px;background:#141312}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--ink);transform:scale(1.1)}
.ruleopts{display:flex;flex-direction:column;gap:7px}
.ruleopts button{text-align:left;padding:11px 13px;border-radius:11px;background:var(--raised);border:1px solid var(--line)}
.ruleopts button b{display:block;font-size:14px;color:var(--ink2)}
.ruleopts button span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.35}
.ruleopts button.on{border-color:var(--accent);background:#221C12}
.ruleopts button.on b{color:var(--accent)}
.freqrow{display:flex;align-items:center;gap:10px}
.freqrow button{width:40px;height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--ink2)}
.freqrow .fv{font-family:var(--font-d);font-size:20px;font-weight:600;min-width:74px;text-align:center}
.mact{display:flex;gap:10px;margin-top:22px}
.mact button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.btn-p{background:var(--accent);color:#141312}
.btn-s{background:var(--raised);border:1px solid var(--line);color:var(--ink2)}
.btn-d{background:none;border:1px solid #5A3128;color:var(--danger)}

/* ============ SETĂRI ============ */
.set-h{margin-top:22px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;margin-top:8px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14.5px}
.setrow .sd{font-size:12px;color:var(--ink3);margin-top:1px;line-height:1.35}
.setrow input[type=time]{width:auto;padding:7px 10px}
.setrow>button{color:var(--accent);font-weight:700;font-size:14px;flex:none}
.setrow>button.dng{color:var(--danger)}
.about p{font-size:13.5px;color:var(--ink2);padding:11px 0;line-height:1.55}
.about b{color:var(--ink)}

/* ============ ONBOARDING ============ */
.onb{background:linear-gradient(150deg,#221D15,#1A1816);border:1px solid #3A311F;border-radius:20px;padding:22px 18px;margin-top:16px}
.onb h2{font-size:20px;color:var(--accent)}
.onb p{font-size:13.5px;color:var(--ink2);margin-top:9px;line-height:1.55}
.onb b{color:var(--ink)}
.onb button{margin-top:16px;background:var(--accent);color:#141312;font-weight:700;padding:11px 22px;border-radius:12px}

/* ============ ABONAMENTE ============ */
.vbar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:9px;overflow:hidden;max-width:210px}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.listsep{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:14px 0 2px;padding-left:2px}
.aboalert{background:#231B12;border:1px solid #4A3720;border-radius:var(--r);padding:13px 15px;margin-top:14px}
.aboalert .t{font-weight:700;font-size:14px;color:var(--accent)}
.aboalert .r{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin-top:6px}
.aboalert .r b{color:var(--ink);font-weight:600;white-space:nowrap}
.aboalert button{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.filters{display:flex;gap:8px;margin-top:14px}
.filters select{flex:1;font-size:13.5px;padding:9px 10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;border-left:3px solid var(--line)}
.scard.warn{border-left-color:var(--accent)}
.scard.late{border-left-color:var(--danger)}
.scard.ok{border-left-color:#3E5C46}
.scard.soon{border-left-color:#3E4C6B}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sname{font-weight:700;font-size:16px;line-height:1.25}
.stags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--ink2);border:1px solid var(--line)}
.tag.t2{color:#C6B79E}
.tag.t3{color:var(--accent);border-color:var(--accent-deep)}
.sedit{width:36px;height:36px;border-radius:10px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.sprice{display:flex;align-items:baseline;gap:8px;margin-top:11px;flex-wrap:wrap}
.sprice b{font-family:var(--font-d);font-size:21px;font-weight:600}
.sprice span{font-size:13px;color:var(--ink2)}
.sprice .sep{color:var(--ink3)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.stat{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--raised);border:1px solid var(--line)}
.stat.warn{color:var(--accent);border-color:var(--accent-deep)}
.stat.late{color:var(--danger);border-color:#5A3128}
.stat.ok{color:#8FB894;border-color:#31462F}
.stat.soon{color:#96AACB;border-color:#2F3A4A}
.sfoot{font-size:12px;color:var(--ink3);margin-top:8px}
.sobs{font-size:12.5px;color:var(--ink2);margin-top:8px;padding:8px 10px;background:var(--raised);border-radius:9px;line-height:1.4}
.sess{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.sess .sl{font-size:12.5px;color:var(--ink2)}
.sess .sl b{color:var(--ink)}
.sdots{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.sdots button{width:38px;height:38px;border-radius:11px;background:var(--raised);border:1px solid var(--line);color:var(--ink3);font-weight:700;font-size:13px;transition:.2s}
.sdots button.on{background:var(--accent);border-color:var(--accent);color:#141312}
.sdates{font-size:11.5px;color:var(--ink3);margin-top:7px}
.brow{display:flex;align-items:center;gap:10px;margin-top:10px}
.brow .bl{font-size:13px;color:var(--ink2);width:98px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{flex:1;height:8px;background:var(--raised);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--accent);opacity:.75;border-radius:99px}
.brow .bv{font-size:12.5px;color:var(--ink);width:78px;text-align:right;flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.prow:last-child{border-bottom:none}

<script>
"use strict";
/* ================================================================
   ATOMIC GVD v3 — obiceiuri (Atomic Habits) + abonamente
   Date locale, fără sincronizare automată: export/import JSON & CSV.
   ================================================================ */

/* ---------------- date & formatare ---------------- */
const ZI  = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const ZIS = ["Lu","Ma","Mi","Jo","Vi","Sâ","Du"];
const LUNA= ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); };
const todayIso = () => iso(new Date());
const addDays = (s,n) => { const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => (fromIso(s).getDay()+6)%7;           // 0=luni … 6=duminică
const isWorkday = s => dow(s) < 5;
const weekStart = s => addDays(s, -dow(s));
const zileIntre = (a,b) => Math.round((fromIso(b)-fromIso(a))/864e5);
const fmtDate  = s => { const d=fromIso(s); return ZI[d.getDay()]+", "+d.getDate()+" "+LUNA[d.getMonth()]; };
const fmtShort = s => { const d=fromIso(s); return d.getDate()+" "+LUNA[d.getMonth()].slice(0,3)+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""); };
const fmtH  = v => { const h=Math.floor(v), m=Math.round((v-h)*60); return m? h+"h"+pad(m) : h+"h"; };
const fmtH2 = v => (Math.round(v*10)/10).toLocaleString("ro-RO",{maximumFractionDigits:1})+" h";
/* „de” după numerale ≥ 20 (gramatică românească) */
const deN = n => (n%100===0 || n%100>=20) ? n+" de " : n+" ";
const zileTxt = n => deN(Math.abs(n))+(Math.abs(n)===1?"zi":"zile");
const saptTxt = n => deN(Math.abs(n))+(Math.abs(n)===1?"săptămână":"săptămâni");
const unitTxt = (n,u) => u==="zile"?zileTxt(n):saptTxt(n);
const fmtRON = v => (Math.round(v*100)/100).toLocaleString("ro-RO",{maximumFractionDigits:2})+" lei";
const fmtEUR = v => (Math.round(v*100)/100).toLocaleString("ro-RO",{maximumFractionDigits:2})+" €";
const pct = v => (v>0?"+":"")+(Math.round(v*10)/10).toLocaleString("ro-RO",{maximumFractionDigits:1})+"%";
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const hex = c => /^#[0-9A-Fa-f]{3,8}$/.test(String(c)) ? c : "#8A8173";   // culori din date, curățate

/* ---------------- date inițiale ---------------- */
const LSKEY = "atomicgvd_v1";
const PALETA = ["#7D6FD6","#199E8C","#AA8F26","#3E85D1","#C96A2E","#C75FA1","#3FA351","#B4543E","#5A7FD1","#8A8A3E"];
const CAT_DEF = ["Sănătate","Divertisment","Profesional","Casă — auto","Casă — general"];
const TIT_DEF = ["George","Casă","Familie"];
const CURS_DEF = 5.08;

function seedHabits(){
  const c = todayIso();
  const H = (o) => Object.assign({tip:"bifa",negativ:false,lucratoare:false,arhivat:false,creat:c,tolerante:1,mini:"",miniOre:null},o);
  return [
    H({id:"h1",nume:"Somn decent",identitate:"Om odihnit",tip:"somn",perWeek:6,tintaOre:7,miniOre:6,culoare:"#7D6FD6",cue:"Dimineața, la trezire, notez orele dormite",mini:"minim 6h"}),
    H({id:"h2",nume:"Înot dimineața",identitate:"Înotător",perWeek:2,culoare:"#199E8C",cue:"Seara pun geanta de înot lângă ușă",mini:"20 de minute în apă"}),
    H({id:"h3",nume:"Mâncare de acasă",identitate:"Om organizat",perWeek:3,lucratoare:true,culoare:"#AA8F26",cue:"Seara pregătesc caserola pentru a doua zi",mini:"măcar fructe și o gustare de acasă"}),
    H({id:"h4",nume:"Engleză",identitate:"Vorbitor de engleză",perWeek:7,culoare:"#3E85D1",cue:"După cafeaua de dimineață, fac lecția",mini:"o lecție de 3 minute"}),
    H({id:"h5",nume:"Fără FB, Flashscore, Sport.ro",identitate:"Om concentrat",negativ:true,perWeek:5,tolerante:0,culoare:"#C96A2E",cue:"Fără aplicații de distragere pe primul ecran"}),
    H({id:"h6",nume:"Postare Raduga",identitate:"Creator",perWeek:2,culoare:"#C75FA1",cue:"După cină, în zilele alese, public postarea",mini:"o poză cu o frază"}),
    H({id:"h7",nume:"Fără bad habit",identitate:"Om liber",negativ:true,perWeek:7,tolerante:0,culoare:"#3FA351",cue:"Seara bifez ziua curată"}),
  ];
}
function seedSubs(){
  const S_=(o)=>Object.assign({moneda:"RON",auto:false,obs:"",sesiuniTotal:0,sesiuni:[],activ:true,preavizZile:0,istoric:[]},o);
  const mk=o=>{ const s=S_(o); s.istoric=[{d:s.start,pret:s.pret,moneda:s.moneda,nota:"prima plată"}]; return s; };
  return [
    mk({id:"s1",nume:"Abonament înot",categorie:"Sănătate",titular:"George",pret:500,recTip:"zile",recN:30,start:"2026-10-20",obs:"4 ședințe incluse",sesiuniTotal:4}),
    mk({id:"s2",nume:"Netflix",categorie:"Divertisment",titular:"George",moneda:"EUR",pret:5,recTip:"zile",recN:30,start:"2026-08-30",auto:true}),
    mk({id:"s3",nume:"Duolingo",categorie:"Divertisment",titular:"George",pret:500,recTip:"ani",recN:1,start:"2026-05-20",auto:true}),
    mk({id:"s4",nume:"Praktika",categorie:"Profesional",titular:"George",pret:500,recTip:"ani",recN:1,start:"2026-05-30",auto:true}),
    mk({id:"s5",nume:"Rovinietă",categorie:"Casă — auto",titular:"Casă",pret:130,recTip:"ani",recN:1,start:"2026-08-30"}),
    mk({id:"s6",nume:"ITP",categorie:"Casă — auto",titular:"Casă",pret:200,recTip:"ani",recN:2,start:"2024-09-20",obs:"ITP Brașov",preavizZile:0}),
    mk({id:"s7",nume:"Asigurare RCA",categorie:"Casă — auto",titular:"Casă",pret:1000,recTip:"ani",recN:1,start:"2025-10-02",obs:"Omniasig",preavizZile:10}),
    mk({id:"s8",nume:"Digi",categorie:"Casă — general",titular:"Casă",pret:64,recTip:"luni",recN:1,start:"2026-05-02",auto:true,obs:"reînnoire automată",preavizZile:30}),
  ];
}

/* ---------------- stare ---------------- */
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ S=null; }
  if(!S || !Array.isArray(S.habits)) S = {v:3};
  if(!Array.isArray(S.habits)) S.habits = seedHabits();
  if(typeof S.entries!=="object"||!S.entries) S.entries={};
  if(!S.settings) S.settings={};
  const st=S.settings;
  if(st.notifAm==null) st.notifAm="07:30";
  if(st.notifPm==null) st.notifPm="21:30";
  if(st.notifOn==null) st.notifOn=false;
  if(!st.celebrated) st.celebrated={};
  if(!st.lastNotif) st.lastNotif={};
  if(st.onboarded==null) st.onboarded=false;
  if(!st.curs) st.curs=CURS_DEF;
  if(!st.categorii) st.categorii=[...CAT_DEF];
  if(!st.titulari) st.titulari=[...TIT_DEF];
  /* curățenie: rămășițe din sincronizarea eliminată */
  delete st.ghToken; delete st.gistId; delete st.syncOn; delete st.lastSyncAt;
  if(!S.deleted) S.deleted=[];
  if(!S.subsDeleted) S.subsDeleted=[];
  if(!S.pauze) S.pauze=[];
  if(!S.note) S.note={};
  if(!S.meta) S.meta={updatedAt:Date.now()};
  if(!S.subs) S.subs=seedSubs();
  /* migrări per obicei */
  S.habits.forEach(h=>{
    if(h.tolerante==null) h.tolerante = h.negativ ? 0 : 1;
    if(h.tolerante>1) h.tolerante=1;                       // nivelul „două omisiuni” a fost scos
    if(h.mini==null) h.mini="";
    if(isNum(h) && !h.tinteIstoric) h.tinteIstoric=[{de:h.creat,val:h.tintaOre}];
    if(isNum(h) && h.miniOre==null) h.miniOre = Math.round(h.tintaOre*0.7*4)/4;
  });
  /* migrări per abonament */
  S.subs.forEach(s=>{
    if(!Array.isArray(s.istoric)||!s.istoric.length) s.istoric=[{d:s.start,pret:s.pret,moneda:s.moneda,nota:"prima plată"}];
    if(s.preavizZile==null) s.preavizZile=0;
    if(!Array.isArray(s.sesiuni)) s.sesiuni=[];
  });
  save(false);
}
function save(touch=true){
  if(touch) S.meta.updatedAt=Date.now();
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }
  catch(e){ toast("Nu am putut salva — memoria dispozitivului e plină. Fă un export și eliberează spațiu."); }
}

/* ---------------- pauze (concediu / boală) ---------------- */
const inPauza = d => (S.pauze||[]).some(p=>d>=p.de && d<=p.pana);
const pauzaActiva = () => (S.pauze||[]).find(p=>todayIso()>=p.de && todayIso()<=p.pana);

/* ---------------- logica obiceiurilor ---------------- */
function isNum(h){ return h.tip==="somn" || h.tip==="ore"; }
const windowDays = h => h.lucratoare ? 5 : 7;
const isDaily    = h => h.perWeek >= windowDays(h);
const schedDay   = (h,d) => (h.lucratoare ? isWorkday(d) : true) && !inPauza(d);
const raw        = (h,d) => (S.entries[d]||{})[h.id];
/* ținta în vigoare la data d (istoricul țintelor păstrează trecutul corect) */
function tintaLa(h,d){
  if(!isNum(h)) return null;
  const ist=h.tinteIstoric||[];
  let v=ist.length?ist[0].val:h.tintaOre;
  ist.forEach(e=>{ if(e.de<=d) v=e.val; });
  return v;
}
/* 1 = complet · 0.5 = varianta minimă (regula celor 2 minute) · 0 = nefăcut */
function nivel(h,d){
  const v=raw(h,d);
  if(v==null) return 0;
  if(isNum(h)){
    const t=tintaLa(h,d), m=h.miniOre!=null?h.miniOre:t*0.7;
    return v>=t ? 1 : (v>=m ? 0.5 : 0);
  }
  return v>=1 ? 1 : (v>0 ? 0.5 : 0);
}
const okDay  = (h,d) => nivel(h,d)>0;          // ține seria vie
const fullDay= (h,d) => nivel(h,d)===1;
const miniDay= (h,d) => nivel(h,d)===0.5;
/* prima zi relevantă: data creării, dar și eventuale bife retroactive mai vechi */
function habStart(h){
  if(h._st) return h._st;
  let min=h.creat;
  for(const d in S.entries){ if(S.entries[d][h.id]!=null && d<min) min=d; }
  h._st=min; return min;
}
function weekDays(ws,h){ const o=[]; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(schedDay(h,d)) o.push(d); } return o; }
const weekHits = (h,ws) => weekDays(ws,h).filter(d=>okDay(h,d)).length;
const weekMet  = (h,ws) => weekHits(h,ws) >= h.perWeek;
/* săptămână neutră: pauză și țintă neatinsă → nu se contorizează nici ca reușită, nici ca ratare */
const weekNeutral = (h,ws) => !weekMet(h,ws) && weekDays(ws,h).length < (h.lucratoare?5:7);

/* --- serii: toleranță aleasă per obicei + maxim o zi liberă la 7 --- */
const tol = h => h.tolerante===0 ? 0 : 1;
const TOL_TXT = ["strict: orice ratare încheie seria","o omisiune permisă (max. una la 7)"];
const SPACING = 7;
function dailyStreak(h){
  const t=todayIso(), T=tol(h), st=habStart(h);
  let n = okDay(h,t)?1:0, grace=0, consec=0, idx=0, lastGrace=-999;
  let cur=addDays(t,-1);
  while(cur>=st){
    if(!schedDay(h,cur)){ cur=addDays(cur,-1); continue; }
    idx++;
    if(okDay(h,cur)){ n++; consec=0; }
    else{
      consec++;
      if(consec>T) break;
      if(idx-lastGrace < SPACING) break;    // a doua zi liberă prea aproape → seria se încheie
      lastGrace=idx; grace++;
    }
    cur=addDays(cur,-1);
  }
  return {n,grace};
}
function bestDailyStreak(h){
  const T=tol(h); let best=0,n=0,consec=0,idx=0,lastGrace=-999, d=habStart(h), t=todayIso();
  while(d<=t){
    if(schedDay(h,d)){
      idx++;
      if(okDay(h,d)){ n++; consec=0; if(n>best)best=n; }
      else{
        consec++;
        if(consec>T || idx-lastGrace<SPACING){ n=0; consec=0; lastGrace=-999; }
        else { lastGrace=idx; }
      }
    }
    d=addDays(d,1);
  }
  return best;
}
function weeklyStreak(h){
  const cw=weekStart(todayIso()), firstW=weekStart(habStart(h)), T=tol(h);
  let n=weekMet(h,cw)?1:0, grace=0, consec=0;
  let w=addDays(cw,-7);
  while(w>=firstW){
    if(weekMet(h,w)){ n++; consec=0; }
    else if(weekNeutral(h,w)){ /* pauză — săptămâna nu contează */ }
    else { consec++; if(consec>T) break; grace++; }
    w=addDays(w,-7);
  }
  return {n,grace};
}
function bestWeeklyStreak(h){
  const T=tol(h); let best=0,n=0,consec=0, w=weekStart(habStart(h)); const cw=weekStart(todayIso());
  while(w<=cw){
    if(weekMet(h,w)){ n++; consec=0; if(n>best)best=n; }
    else if(weekNeutral(h,w)){ }
    else if(w<cw){ consec++; if(consec>T){ n=0; consec=0; } }
    w=addDays(w,7);
  }
  return best;
}
function streakInfo(h){
  if(isDaily(h)){ const s=dailyStreak(h); return {n:s.n,grace:s.grace,unit:"zile",best:bestDailyStreak(h)}; }
  const s=weeklyStreak(h); return {n:s.n,grace:s.grace,unit:"săpt.",best:bestWeeklyStreak(h)};
}
function ratariRecente(h){
  let n=0;
  if(isDaily(h)){
    let cur=addDays(todayIso(),-1), st=habStart(h);
    while(cur>=st){ if(!schedDay(h,cur)){ cur=addDays(cur,-1); continue; } if(okDay(h,cur)) break; n++; cur=addDays(cur,-1); }
  } else {
    let w=addDays(weekStart(todayIso()),-7), firstW=weekStart(habStart(h));
    while(w>=firstW){ if(weekMet(h,w)||weekNeutral(h,w)) break; n++; w=addDays(w,-7); }
  }
  return n;
}
/* mesajul de salvare — acum și pentru obiceiurile săptămânale */
function stareSerie(h){
  const t=todayIso();
  if(!schedDay(h,t)) return null;
  if(isDaily(h)){
    if(okDay(h,t)) return null;
    const r=ratariRecente(h), T=tol(h);
    if(r===0) return null;
    return r>T ? "rupt" : "risc";
  }
  // săptămânal: risc dacă zilele rămase abia acoperă reprizele rămase
  const ws=weekStart(t), hits=weekHits(h,ws);
  if(hits>=h.perWeek) return null;
  const ramase=weekDays(ws,h).filter(d=>d>=t).length, nec=h.perWeek-hits;
  if(ramase<nec) return "ratata";
  if(ramase===nec) return "risc";
  if(ratariRecente(h)>tol(h)) return "rupt";
  return null;
}
/* ce e de făcut azi: zilnic = programat; săptămânal = doar dacă ținta nu e atinsă */
function dueToday(h,d){
  if(!schedDay(h,d)) return false;
  if(okDay(h,d)) return false;
  if(isDaily(h)) return true;
  return weekHits(h,weekStart(d)) < h.perWeek;
}
function votes(h){
  let n=0, d=habStart(h), t=todayIso();
  const lim=1200; let g=0;
  while(d<=t && g++<lim*6){ if(okDay(h,d)) n++; d=addDays(d,1); }
  return n;
}
function strength(h){                     // consistență raportată la ȚINTĂ, netezită
  const t=todayIso();
  if(isDaily(h)){
    let d=addDays(t,-90); if(d<habStart(h)) d=habStart(h);
    let s=0,k=0.06,any=false;
    while(d<t){ if(schedDay(h,d)){ s=s*(1-k)+nivel(h,d)*k; any=true; } d=addDays(d,1); }
    if(okDay(h,t)) s=s*(1-k)+nivel(h,t)*k;
    return any?Math.round(s*100):0;
  }
  /* săptămânal: cât din ținta săptămânii a fost atinsă (o săptămână completă = 100%) */
  const cw=weekStart(t);
  let w=weekStart(addDays(t,-90)); const fw=weekStart(habStart(h)); if(w<fw) w=fw;
  let s=0,k=0.25,any=false;
  while(w<cw){
    if(!weekNeutral(h,w)){ s=s*(1-k)+Math.min(weekHits(h,w)/h.perWeek,1)*k; any=true; }
    w=addDays(w,7);
  }
  const cur=Math.min(weekHits(h,cw)/h.perWeek,1);
  if(any) s=s*0.85+cur*0.15; else s=cur;
  return Math.round(s*100);
}
const activeHabits = () => S.habits.filter(h=>!h.arhivat);
const invalidateCache = () => S.habits.forEach(h=>{ delete h._st; });

/* ================================================================
   ABONAMENTE — perioade, istoric de preț, cost, prognoză
   ================================================================ */
const curs   = () => S.settings.curs||CURS_DEF;
const inRON  = (v,m) => m==="RON" ? v : v*curs();
const inEUR  = (v,m) => m==="EUR" ? v : v/curs();
/* preț curent = ultima intrare din istoric */
function ultimaPlata(s){
  const h=(s.istoric||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  return h.length? h[h.length-1] : {d:s.start,pret:s.pret,moneda:s.moneda};
}
const subRON = s => { const p=ultimaPlata(s); return inRON(p.pret,p.moneda); };
const subEUR = s => { const p=ultimaPlata(s); return inEUR(p.pret,p.moneda); };
/* a k-a scadență calculată DIN data de origine (fără derapaj după lunile scurte) */
function ocurenta(startIso,tip,n,k){
  const x=fromIso(startIso);
  if(tip==="zile"){ x.setDate(x.getDate()+n*k); return iso(x); }
  const zi=x.getDate(); x.setDate(1);
  if(tip==="luni") x.setMonth(x.getMonth()+n*k); else x.setFullYear(x.getFullYear()+n*k);
  const ultima=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
  x.setDate(Math.min(zi,ultima));
  return iso(x);
}
/* acoperirea plătită: de la ultima plată până la scadența următoare */
function acoperire(s){
  const p=ultimaPlata(s);
  if(s.recTip==="unic"||s.recTip==="nevoie") return {de:p.d, pana:null};
  return {de:p.d, pana:ocurenta(p.d,s.recTip,s.recN,1)};
}
/* perioada curentă: pentru cele cu reînnoire automată avansăm; pentru restul rămâne acoperirea plătită */
function subPeriod(s){
  const t=todayIso(), p=ultimaPlata(s);
  if(s.recTip==="unic"||s.recTip==="nevoie") return {start:p.d,end:null,k:0};
  let k=0, a=p.d, b=ocurenta(p.d,s.recTip,s.recN,1);
  if(a>t) return {start:a,end:b,k:0};
  if(s.auto){ while(b<=t && k<600){ k++; a=b; b=ocurenta(p.d,s.recTip,s.recN,k+1); } }
  return {start:a,end:b,k};
}
function subStatus(s){
  if(s.activ===false) return {k:"off",txt:"inactiv",zile:null};
  const t=todayIso(), per=subPeriod(s);
  if(s.recTip==="unic") return {k:"ok",txt:"plată unică · "+fmtShort(per.start),zile:null};
  if(s.recTip==="nevoie") return {k:"ok",txt:"la nevoie · ultima "+fmtShort(per.start),zile:null};
  if(per.start>t) return {k:"soon",txt:"începe pe "+fmtShort(per.start),zile:zileIntre(t,per.start)};
  const z=zileIntre(t,per.end);
  if(z<0)  return {k:"late",txt:"expirat de "+zileTxt(-z),zile:z};
  if(z===0)return {k:"late",txt:(s.auto?"se reînnoiește azi":"expiră azi"),zile:0};
  if(z<=7) return {k:"warn",txt:(s.auto?"reînnoire":"expiră")+(z===1?" mâine":" în "+zileTxt(z)),zile:z};
  return {k:"ok",txt:(s.auto?"reînnoire":"expiră")+" în "+zileTxt(z),zile:z};
}
/* data-limită de reziliere (preaviz) */
function dataPreaviz(s){
  const per=subPeriod(s);
  if(!per.end||!s.preavizZile) return null;
  return addDays(per.end,-s.preavizZile);
}
function periodMonths(s){
  if(s.recTip==="zile") return s.recN/30.4375;
  if(s.recTip==="luni") return s.recN;
  if(s.recTip==="ani")  return s.recN*12;
  return 0;                                   // unic / la nevoie — nu se normalizează
}
const normalizat = s => periodMonths(s)>0 ? subRON(s)/periodMonths(s) : 0;
/* scadențe viitoare (prognoză) și trecute (istoric real din plăți) */
function scadenteIntre(s,from,to){
  const out=[];
  if(s.activ===false) return out;
  if(s.recTip==="unic"||s.recTip==="nevoie"){
    (s.istoric||[]).forEach(p=>{ if(p.d>=from&&p.d<=to) out.push({d:p.d,ron:inRON(p.pret,p.moneda),real:true}); });
    return out;
  }
  (s.istoric||[]).forEach(p=>{ if(p.d>=from&&p.d<=to) out.push({d:p.d,ron:inRON(p.pret,p.moneda),real:true}); });
  const p=ultimaPlata(s), pret=inRON(p.pret,p.moneda);
  for(let k=1;k<=600;k++){
    const d=ocurenta(p.d,s.recTip,s.recN,k);
    if(d>to) break;
    if(d>=from && d>p.d) out.push({d,ron:pret,real:false});
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}
/* variația ultimei reînnoiri */
function variatiePret(s){
  const h=(s.istoric||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(h.length<2) return null;
  const now=inRON(h[h.length-1].pret,h[h.length-1].moneda), prev=inRON(h[h.length-2].pret,h[h.length-2].moneda);
  if(!prev) return null;
  return {abs:now-prev, pct:(now-prev)/prev*100, de:h[h.length-1].d, dePrev:h[h.length-2].d};
}
/* variația totală, de la prima plată */
function variatieTotala(s){
  const h=(s.istoric||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(h.length<2) return null;
  const now=inRON(h[h.length-1].pret,h[h.length-1].moneda), first=inRON(h[0].pret,h[0].moneda);
  if(!first) return null;
  const ani=Math.max(zileIntre(h[0].d,h[h.length-1].d)/365.25, 0.01);
  const cagr=(Math.pow(now/first,1/ani)-1)*100;
  return {abs:now-first, pct:(now-first)/first*100, ani, cagr};
}
/* ședințele din perioada curentă + cost pe utilizare */
function sesiuniPerioada(s){
  const per=subPeriod(s);
  return (s.sesiuni||[]).filter(d=>d>=per.start && (!per.end||d<per.end));
}
function costUtilizare(s){
  if(!s.sesiuniTotal) return null;
  const fol=sesiuniPerioada(s).length, pret=subRON(s);
  return {folosite:fol, total:s.sesiuniTotal,
    laFolosite: fol? pret/fol : null,
    laPlin: pret/s.sesiuniTotal};
}
const subsActive = () => (S.subs||[]).filter(s=>s.activ!==false);
function recTxt(s){
  if(s.recTip==="unic")   return "plată unică";
  if(s.recTip==="nevoie") return "la nevoie";
  if(s.recTip==="ani"  && s.recN===1) return "anual";
  if(s.recTip==="luni" && s.recN===1) return "lunar";
  if(s.recTip==="zile") return "la "+zileTxt(s.recN);
  return "la "+s.recN+" "+(s.recTip==="luni"?"luni":"ani");
}
/* abonamente care cer atenție: expirate, scadente în 7 zile sau cu preaviz aproape */
function abonamenteUrgente(){
  const t=todayIso();
  return subsActive().filter(s=>{
    const st=subStatus(s);
    if(st.k==="late"||st.k==="warn") return true;
    const pz=dataPreaviz(s);
    return pz && pz>=t && zileIntre(t,pz)<=7;
  });
}

  renderPauzaBar();
  renderRevizuireCard(isToday);
  renderAboAlert(isToday);

  const hs=activeHabits();
  const facute = hs.filter(h=>okDay(h,viewDate));
  const deFacut= hs.filter(h=>dueToday(h,viewDate));
  const totalAzi = facute.length + deFacut.length;
  const ramase = deFacut.length;
  const totalVotes = hs.reduce((a,h)=>a+votes(h),0);
  const inc = pauzaActiva() ? "pauză activă — nimic nu se pierde"
    : totalAzi===0 ? "zi liberă"
    : ramase===0 ? "tot ce era de făcut azi, bifat"
    : facute.length===0 ? "prima bifă e cea mai grea"
    : ramase===1 ? "a mai rămas una singură" : "au mai rămas "+ramase;
  $("#votebar").innerHTML=`<div style="flex:1"><div class="n num">${facute.length}<span style="font-size:15px;color:var(--ink2)">/${totalAzi}</span></div>
    <div class="t">${isToday?"azi":fmtShort(viewDate)} · ${inc}</div>
    <div class="vbar"><i style="width:${totalAzi?Math.round(facute.length/totalAzi*100):0}%"></i></div></div>
    <div style="text-align:right;padding-left:12px"><div class="n num" style="font-size:19px">${totalVotes}</div><div class="t">voturi,<br>pentru cine devii</div></div>`;

  /* ordonare: de făcut → bifate → ținta săptămânii atinsă → în afara programului */
  const rank = h => !schedDay(h,viewDate) ? 3 : okDay(h,viewDate) ? 1 : (dueToday(h,viewDate) ? 0 : 2);
  const SEP = {1:"Bifate",2:"Ținta săptămânii atinsă",3:"În afara programului"};
  const lista=hs.map((h,i)=>({h,i})).sort((a,b)=>rank(a.h)-rank(b.h)||a.i-b.i).map(x=>x.h);
  const box=$("#hlist"); box.innerHTML="";
  let ultim=-1, avertismente=0;
  lista.forEach(h=>{
    const r=rank(h);
    if(r!==ultim && r>0 && lista.some(x=>rank(x)<r)){
      const s=document.createElement("div"); s.className="listsep"; s.textContent=SEP[r]; box.appendChild(s);
    }
    ultim=r;
    box.appendChild(cardObicei(h,r,()=>avertismente++,()=>avertismente));
  });
  if(!lista.length) box.innerHTML=`<div class="empty">Niciun obicei activ.<br>Adaugă unul din fila Obiceiuri.</div>`;
}

function renderPauzaBar(){
  const p=pauzaActiva(), box=$("#pauzabar");
  if(!p){ box.innerHTML=""; return; }
  box.innerHTML=`<div class="pauzabar"><div><div class="t">Pauză: ${esc(p.motiv||"planificată")}</div>
    <div class="s">${fmtShort(p.de)} → ${fmtShort(p.pana)} · zilele astea nu se contorizează</div></div>
    <button id="pauzaStop">Încheie</button></div>`;
  $("#pauzaStop").addEventListener("click",()=>{
    p.pana=addDays(todayIso(),-1); if(p.pana<p.de) S.pauze=S.pauze.filter(x=>x!==p);
    save(); renderAzi(); toast("Pauza s-a încheiat. Bun venit înapoi.");
  });
}

function cardObicei(h,r){
  const off = !schedDay(h,viewDate);
  const niv = nivel(h,viewDate);
  const si  = streakInfo(h);
  const hc  = hex(h.culoare);
  const card=document.createElement("div");
  card.className="hcard"+(niv===1?" done":"")+(niv===0.5?" done partial":"")+(off||r===2?" offday":"");
  card.style.setProperty("--hc",hc);

  let meta="";
  if(isDaily(h)){
    meta+=`<span class="pill ${si.n>0?'hot':''} num">serie: ${unitTxt(si.n,si.unit)}</span>`;
    if(tol(h)===0) meta+=`<span class="pill">regulă strictă</span>`;
    else if(stareSerie(h)==="risc") meta+=`<span class="pill warn">ziua liberă e folosită</span>`;
    else if(si.grace>0) meta+=`<span class="pill num">${si.grace===1?"1 zi liberă":si.grace+" zile libere"}</span>`;
  } else {
    const ws=weekStart(viewDate), hits=weekHits(h,ws);
    const dots=Array.from({length:h.perWeek},(_,i)=>`<i class="${i<hits?'on':''}"></i>`).join("");
    meta+=`<span class="pill num" style="display:flex;align-items:center;gap:7px">săpt: ${hits}/${h.perWeek} <span class="wkdots">${dots}</span></span>`;
    if(si.n>0) meta+=`<span class="pill hot num">serie: ${unitTxt(si.n,si.unit)}</span>`;
  }
  if(miniDay(h,viewDate)) meta+=`<span class="pill">variantă minimă</span>`;

  const st=stareSerie(h);
  const salvare = (viewDate===todayIso() && st) ? rescueHtml(h,st) : "";

  if(isNum(h)){
    const somn=h.tip==="somn", cuv=somn?"dormite":"lucrate";
    const tinta=tintaLa(h,viewDate), mini=h.miniOre!=null?h.miniOre:tinta*0.7;
    const chips = somn?[6,6.5,7,7.5,8]:[mini,tinta,tinta+0.5,tinta+1].map(x=>Math.round(x*4)/4).filter((x,i,a)=>x>0&&a.indexOf(x)===i);
    const v=raw(h,viewDate);
    const baza = v!=null?v:(raw(h,addDays(viewDate,-1)) ?? tinta);
    const avg=mediaSapt(h,weekStart(viewDate));
    card.innerHTML=`<div class="stripe"></div>
      <div class="hbody">
        <div class="hname">${esc(h.nume)}</div>
        <div class="hcue">${esc(h.cue||"")}</div>
        <div class="sleepctl">
          <button class="stepper" data-a="-" aria-label="Scade 15 minute">−</button>
          <div class="val num">${v!=null?fmtH(v):"—"} <small>${v!=null?cuv:"nescris"}</small></div>
          <button class="stepper" data-a="+" aria-label="Crește 15 minute">+</button>
          <span class="statelbl" style="color:${niv===1?hc:niv===0.5?"var(--accent)":"var(--ink3)"}">${v==null?"notează":niv===1?"țintă atinsă":niv===0.5?"variantă minimă":"sub "+fmtH(mini)}</span>
        </div>
        <div class="chips">${chips.map(x=>`<button data-h="${x}" class="num">${fmtH(x)}</button>`).join("")}</div>
        <div class="hmeta">${meta}${avg!=null?`<span class="pill num">medie săpt: ${fmtH2(avg)}</span>`:""}</div>
        ${salvare}
      </div>`;
    card.querySelectorAll(".stepper[data-a]").forEach(b=>b.addEventListener("click",()=>{
      const cur=raw(h,viewDate), b0=cur!=null?cur:baza;
      setVal(h,viewDate,Math.max(0,Math.min(16,b0+(b.dataset.a==="+"?0.25:-0.25))),cur==null);
    }));
    card.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>
      setVal(h,viewDate,parseFloat(b.dataset.h),raw(h,viewDate)==null)));
  } else {
    card.innerHTML=`<div class="stripe"></div>
      <button class="checkbtn" aria-label="Bifează ${esc(h.nume)}" aria-pressed="${niv>0}" ${off?"disabled":""}>
        <svg viewBox="0 0 52 52" aria-hidden="true"><circle class="ringbg" cx="26" cy="26" r="24"/><circle class="ringfg" cx="26" cy="26" r="24"/></svg>
        <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
        <svg class="mini" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <div class="hbody">
        <div class="hname">${esc(h.nume)}</div>
        <div class="hcue">${esc(h.cue||"")}</div>
        <div class="hmeta">${meta}</div>
        ${off?`<div class="hcue" style="margin-top:6px">${inPauza(viewDate)?"pauză":"doar în zile lucrătoare"}</div>`:""}
        ${(!off&&niv===0&&h.mini)?`<button class="minibtn">nu pot azi — fac varianta minimă: ${esc(h.mini)}</button>`:""}
        ${salvare}
      </div>`;
    const btn=card.querySelector(".checkbtn");
    if(!off) btn.addEventListener("click",()=>toggle(h));
    const mb=card.querySelector(".minibtn");
    if(mb) mb.addEventListener("click",()=>setMini(h));
  }
  return card;
}
function mediaSapt(h,ws){
  const v=weekDays(ws,h).map(d=>raw(h,d)).filter(x=>x!=null);
  return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function rescueHtml(h,st){
  const si=streakInfo(h), u=si.unit;
  const mini = h.mini? ` Varianta minimă (<b>${esc(h.mini)}</b>) contează și ea.` : " Chiar și varianta mică ține seria.";
  if(st==="risc" && isDaily(h) && si.n>0)
    return `<div class="rescue"><b>Ți-ai folosit ziua liberă — seria de ${unitTxt(si.n,u)} e intactă.</b> Încă o ratare o încheie.${mini}</div>`;
  if(st==="risc")
    return `<div class="rescue"><b>Mai ai exact câte zile îți trebuie</b> ca să atingi ținta săptămânii. De azi înainte, fiecare zi contează.${mini}</div>`;
  if(st==="ratata")
    return `<div class="rescue"><b>Ținta săptămânii nu mai e matematic posibilă.</b> Fă totuși ce poți azi: ratarea unei săptămâni nu rupe seria, două la rând da.</div>`;
  if(tol(h)===0 && si.best>0)
    return `<div class="rescue"><b>Seria s-a oprit — recordul rămâne ${unitTxt(si.best,u)}.</b> Asta e regula strictă pe care ai ales-o, și e potrivită aici. Prima bifă de azi pornește seria următoare.</div>`;
  return `<div class="rescue"><b>Reîncepem azi.</b> O ratare nu șterge nimic din ce ai construit.${mini}</div>`;
}

function toggle(h){
  const d=viewDate;
  if(okDay(h,d)){
    delete S.entries[d][h.id];
    if(!Object.keys(S.entries[d]).length) delete S.entries[d];
    save(); renderAzi(); return;
  }
  (S.entries[d]=S.entries[d]||{})[h.id]=1; save();
  afterDone(h);
}
function setMini(h){
  const d=viewDate;
  (S.entries[d]=S.entries[d]||{})[h.id]=0.5; save();
  afterDone(h,"Varianta minimă —");
}
function setVal(h,d,v,primaData){
  (S.entries[d]=S.entries[d]||{})[h.id]=Math.round(v*100)/100;
  save();
  if(primaData && nivel(h,d)>0) afterDone(h,`${fmtH(v)} ${h.tip==="somn"?"dormite":"lucrate"} —`);
  else renderAzi();
}
function afterDone(h,prefix){
  if(navigator.vibrate) navigator.vibrate(28);
  renderAzi();
  const v=votes(h), si=streakInfo(h), id=esc(h.identitate||"omul care își ține promisiunile");
  const pool = h.negativ
    ? [`Zi curată. Votul #${v} pentru: <b>${id}</b>.`,`Ai rezistat — al ${v}-lea vot pentru <b>${id}</b>.`,`Bravo. Fiecare zi ca asta întărește <b>${id}</b>.`]
    : [`Felicitări — votul #${v} pentru: <b>${id}</b>.`,`Bifat. Așa arată <b>${id}</b> — al ${v}-lea vot.`,`Încă un vot pentru <b>${id}</b> (#${v}).`];
  if(si.n>=3) pool.push(`Felicitări — serie de <b>${unitTxt(si.n,si.unit)}</b>. Ții ritmul.`);
  toast((prefix?prefix+" ":"")+pool[v%pool.length]);
  const m=checkMilestone(h); if(m) setTimeout(()=>celebrate(m),700);
}

/* ================================================================
   ECRANUL ABONAMENTE
   ================================================================ */
function renderAboAlert(isToday){
  /* sus doar ce e deja expirat; restul, sub lista de obiceiuri — ecranul Azi are o singură treabă */
  const urgent=abonamenteUrgente().some(s=>subStatus(s).k==="late");
  const box=$(urgent?"#aboalert":"#aboalert2"); const alt=$(urgent?"#aboalert2":"#aboalert");
  if(alt) alt.innerHTML="";
  if(!box) return;
  if(!isToday){ box.innerHTML=""; return; }
  const urg=abonamenteUrgente();
  if(!urg.length){ box.innerHTML=""; return; }
  box.innerHTML=`<div class="aboalert">
    <div class="t">${urg.length===1?"Un abonament cere atenție":deN(urg.length)+"abonamente cer atenție"}</div>
    ${urg.slice(0,3).map(s=>{ const st=subStatus(s), pz=dataPreaviz(s);
      const info = st.k==="late"||st.k==="warn" ? st.txt : "anulează până pe "+fmtShort(pz);
      return `<div class="r"><span>${esc(s.nume)}</span><b style="color:${st.k==="late"?"var(--danger)":"var(--accent)"}">${esc(info)}</b></div>`;}).join("")}
    <button id="aboGo">Vezi abonamentele</button></div>`;
  $("#aboGo").addEventListener("click",()=>goTab("abo"));
}

function renderAbo(){
  const body=$("#abobody"); if(!body) return;
  $$("#aboseg button").forEach(x=>x.classList.toggle("on",x.dataset.m===aboMode));
  body.innerHTML="";
  const cats=[...new Set([...(S.settings.categorii||[]),...subsActive().map(s=>s.categorie)])].filter(Boolean);
  const tits=[...new Set([...(S.settings.titulari||[]),...subsActive().map(s=>s.titular)])].filter(Boolean);
  const f=document.createElement("div"); f.className="filters";
  f.innerHTML=`<select id="fCat" aria-label="Filtru categorie"><option value="">Toate categoriile</option>${cats.map(c=>`<option ${c===aboFiltCat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select id="fTit" aria-label="Filtru titular"><option value="">Toți titularii</option>${tits.map(c=>`<option ${c===aboFiltTit?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
  body.appendChild(f);
  f.querySelector("#fCat").addEventListener("change",e=>{aboFiltCat=e.target.value;renderAbo();});
  f.querySelector("#fTit").addEventListener("change",e=>{aboFiltTit=e.target.value;renderAbo();});
  if(aboMode==="lista") renderAboLista(body); else renderAboRap(body);
}
const aboFiltrate = () => subsActive().filter(s=>(!aboFiltCat||s.categorie===aboFiltCat)&&(!aboFiltTit||s.titular===aboFiltTit));

function renderAboLista(body){
  const ord = {late:0,warn:1,soon:2,ok:3,off:4};
  const list=aboFiltrate().slice().sort((a,b)=>{
    const sa=subStatus(a), sb=subStatus(b);
    return (ord[sa.k]-ord[sb.k]) || ((sa.zile??9999)-(sb.zile??9999));
  });
  const totL=list.reduce((a,s)=>a+normalizat(s),0);
  const unice=list.filter(s=>periodMonths(s)===0).length;
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${fmtRON(totL)}</div><div class="l">pe lună, recurente (${fmtEUR(totL/curs())})</div></div>
    <div class="kpi"><div class="v num">${fmtRON(totL*12)}</div><div class="l">pe an · ${deN(list.length)}abonamente${unice?` · ${unice} fără recurență`:""}</div></div>`;
  body.appendChild(kp);
  if(!list.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="Niciun abonament pentru filtrele alese."; body.appendChild(e); }
  list.forEach(s=>body.appendChild(cardAbonament(s)));
  const add=document.createElement("button"); add.className="addbtn"; add.textContent="+ Abonament nou";
  add.addEventListener("click",()=>openSubForm(null)); body.appendChild(add);

  const inact=(S.subs||[]).filter(s=>s.activ===false);
  if(inact.length){
    const h=document.createElement("div"); h.className="arch-h"; h.textContent="Inactive"; body.appendChild(h);
    inact.forEach(s=>{
      const c=document.createElement("div"); c.className="scard off"; c.style.opacity=".6";
      c.innerHTML=`<div class="shead"><div><div class="sname">${esc(s.nume)}</div>
        <div class="stags"><span class="tag">${esc(s.categorie||"—")}</span><span class="tag t2">${(s.istoric||[]).length} plăți în istoric</span></div></div>
        <button class="sedit" aria-label="Modifică">⋯</button></div>`;
      c.querySelector(".sedit").addEventListener("click",()=>openSubForm(s));
      body.appendChild(c);
    });
  }
}

function cardAbonament(s){
  const st=subStatus(s), per=subPeriod(s), pz=dataPreaviz(s), t=todayIso();
  const vr=variatiePret(s), vt=variatieTotala(s), cu=costUtilizare(s);
  const c=document.createElement("div"); c.className="scard "+st.k;

  let deltaHtml="";
  if(vr){
    const cls = vr.abs>0?"cost-up":vr.abs<0?"cost-down":"flat";
    deltaHtml=`<span class="delta ${cls}">${vr.abs>0?"▲":vr.abs<0?"▼":"="} ${pct(vr.pct)} · ${vr.abs>0?"+":""}${fmtRON(vr.abs)}</span>`;
  }
  let ses="";
  if(s.sesiuniTotal>0){
    const folosite=sesiuniPerioada(s), n=folosite.length;
    ses=`<div class="sess"><div class="sl">ședințe în perioada curentă: <b class="num">${n}/${s.sesiuniTotal}</b></div>
      <div class="sdots">${Array.from({length:s.sesiuniTotal},(_,i)=>`<button data-i="${i}" class="${i<n?"on":""}" aria-pressed="${i<n}" aria-label="Ședința ${i+1}">${i+1}</button>`).join("")}</div>
      ${n?`<div class="sdates">${folosite.map(d=>fmtShort(d)).join(" · ")}</div>`:""}</div>`;
  }
  let cuHtml="";
  if(cu){
    cuHtml=`<div class="cpu"><span>cost pe ședință${cu.folosite?" (la "+cu.folosite+" folosite)":""}</span>
      <b class="num">${cu.folosite?fmtRON(cu.laFolosite):"—"}</b></div>
      <div class="lbl-mini">la utilizare completă (${s.sesiuniTotal}): ${fmtRON(cu.laPlin)}</div>`;
  }
  let istHtml="";
  const ist=(s.istoric||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  if(ist.length){
    istHtml=`<div class="hist"><div class="hh">Istoric preț${vt?` · total ${pct(vt.pct)} în ${vt.ani<1?"sub un an":deN(Math.round(vt.ani))+"ani"}`:""}</div>
      ${ist.slice(-6).map((p,i,arr)=>{
        const prev=i>0?arr[i-1]:null;
        const cur=inRON(p.pret,p.moneda);
        let d="";
        if(prev){ const pv=inRON(prev.pret,prev.moneda); if(pv){ const dp=(cur-pv)/pv*100;
          d=`<span class="delta ${dp>0?"cost-up":dp<0?"cost-down":"flat"}">${pct(dp)}</span>`; } }
        return `<div class="hrow"><span class="hd num">${fmtShort(p.d)}</span><span class="hp num">${fmtRON(cur)}</span>${p.moneda!=="RON"?`<span style="color:var(--ink3);font-size:12px">(${p.pret} ${p.moneda})</span>`:""}<span class="hv">${d}</span></div>`;
      }).join("")}
      ${ist.length>6?`<div class="lbl-mini">primele ${ist.length-6} plăți nu sunt afișate</div>`:""}</div>`;
  }
  const potiReinnoi = s.recTip!=="unic";   // istoricul de preț se construiește la fiecare reînnoire

  c.innerHTML=`
    <div class="shead">
      <div><div class="sname">${esc(s.nume)}</div>
        <div class="stags"><span class="tag">${esc(s.categorie||"—")}</span><span class="tag t2">${esc(s.titular||"—")}</span>${s.auto?`<span class="tag t3">reînnoire automată</span>`:""}</div></div>
      <button class="sedit" aria-label="Modifică ${esc(s.nume)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
    </div>
    <div class="sprice"><b class="num">${fmtRON(subRON(s))}</b><span class="num">${fmtEUR(subEUR(s))}</span><span class="sep">·</span><span>${recTxt(s)}</span>${deltaHtml}</div>
    <div class="srow"><span class="stat ${st.k}">${esc(st.txt)}</span><span class="num">${periodMonths(s)>0?"≈ "+fmtRON(normalizat(s))+"/lună":""}</span></div>
    <div class="sfoot">${per.end?`perioada plătită: ${fmtShort(per.start)} → ${fmtShort(per.end)}`:`plătit pe ${fmtShort(per.start)}`}${pz?` · <span style="color:${pz>=t&&zileIntre(t,pz)<=7?"var(--accent)":"var(--ink3)"}">anulează până pe ${fmtShort(pz)}</span>`:""}</div>
    ${s.obs?`<div class="sobs">${esc(s.obs)}</div>`:""}
    ${cuHtml}${ses}${istHtml}
    ${potiReinnoi?`<div class="renew"><button data-a="reinnoit" class="${st.k==="late"||st.k==="warn"?"":"sec"}">Am reînnoit / am plătit${st.k==="late"||st.k==="warn"?"":" — înregistrează prețul"}</button></div>`:""}`;

  c.querySelector(".sedit").addEventListener("click",()=>openSubForm(s));
  const rb=c.querySelector('[data-a="reinnoit"]');
  if(rb) rb.addEventListener("click",()=>dialogReinnoire(s));
  c.querySelectorAll(".sdots button").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i, per2=subPeriod(s);
    const vechi=(s.sesiuni||[]).filter(d=>d<per2.start);
    let cur=sesiuniPerioada(s);
    if(i<cur.length) cur=cur.slice(0,i); else { for(let k=cur.length;k<=i;k++) cur.push(todayIso()); }
    s.sesiuni=[...vechi,...cur].sort(); save(); renderAbo();
    const n=cur.length;
    if(n===s.sesiuniTotal){ if(navigator.vibrate) navigator.vibrate([30,50,30]);
      const cu2=costUtilizare(s); toast(`Toate cele ${s.sesiuniTotal} ședințe folosite — <b>${fmtRON(cu2.laFolosite)}</b> pe ședință.`); }
    else if(i>=n-1 && n>0) toast(`Ședința ${n} din ${s.sesiuniTotal} — bifată.`);
  }));
  return c;
}

/* reînnoire: cere prețul nou, calculează variația, adaugă în istoric */
function dialogReinnoire(s){
  const p=ultimaPlata(s), per=subPeriod(s);
  const dataSugerata = per.end && per.end<=todayIso() ? per.end : todayIso();
  inputDlg({titlu:"Reînnoire — "+s.nume, eticheta:`Prețul plătit acum (${p.moneda})`, valoare:p.pret, tip:"number",
    hint:`Prețul anterior a fost <b>${p.pret} ${p.moneda}</b>, plătit pe ${fmtShort(p.d)}. Data noii plăți: ${fmtShort(dataSugerata)}.`,
    ok:"Înregistrează"},(val)=>{
    const nou=parseFloat(String(val).replace(",","."));
    if(isNaN(nou)||nou<0) return;
    s.istoric.push({d:dataSugerata,pret:nou,moneda:p.moneda,nota:""});
    s.istoric.sort((a,b)=>a.d<b.d?-1:1);
    s.pret=nou; s.moneda=p.moneda;
    save(); renderAbo();
    const vechi=inRON(p.pret,p.moneda), acum=inRON(nou,p.moneda);
    if(vechi && Math.abs(acum-vechi)>0.005){
      const dp=(acum-vechi)/vechi*100;
      celebrateFree(s.nume+" — reînnoit", pct(dp),
        `${acum>vechi?"Scumpire":"Ieftinire"} de ${fmtRON(Math.abs(acum-vechi))} pe perioadă (${fmtRON(vechi)} → ${fmtRON(acum)}). Pe an: ${fmtRON(Math.abs(acum-vechi)*(12/Math.max(periodMonths(s),0.0001)))} ${acum>vechi?"în plus":"în minus"}.`);
    } else toast(`Reînnoire înregistrată la același preț: ${fmtRON(acum)}.`);
  });
}

/* --- rapoarte abonamente: prognoză 12 luni / lună / an --- */
function renderAboRap(body){
  const seg=document.createElement("div"); seg.className="seg seg4";
  seg.innerHTML=`<button data-p="prognoza" class="${aboRapMod==="prognoza"?"on":""}">12 luni</button>
    <button data-p="luna" class="${aboRapMod==="luna"?"on":""}">Lună</button>
    <button data-p="an" class="${aboRapMod==="an"?"on":""}">An</button>
    <button data-p="pret" class="${aboRapMod==="pret"?"on":""}">Prețuri</button>`;
  body.appendChild(seg);
  seg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ aboRapMod=b.dataset.p; aboAnchor=todayIso(); renderAbo(); }));
  const list=aboFiltrate();
  if(aboRapMod==="prognoza") return rapPrognoza(body,list);
  if(aboRapMod==="pret")     return rapPreturi(body,list);
  return rapPerioada(body,list);
}

function rapPrognoza(body,list){
  const t=todayIso(), d=fromIso(t); const to=new Date(d.getFullYear(),d.getMonth()+12,d.getDate()); const toIso=iso(to);
  const plati=[]; list.forEach(s=>scadenteIntre(s,t,toIso).forEach(p=>plati.push({...p,s})));
  plati.sort((a,b)=>a.d<b.d?-1:1);
  const total=plati.reduce((a,p)=>a+p.ron,0);
  const norm=list.reduce((a,s)=>a+normalizat(s),0)*12;
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${fmtRON(total)}</div><div class="l">de plătit în următoarele 12 luni<br>${fmtEUR(total/curs())} · ${deN(plati.length)}plăți</div></div>
    <div class="kpi"><div class="v num">${fmtRON(norm/12)}</div><div class="l">media lunară a recurentelor<br>${fmtEUR(norm/12/curs())}</div></div>`;
  body.appendChild(kp);
  // pe luni
  const luni=[]; for(let i=0;i<12;i++){ const x=new Date(d.getFullYear(),d.getMonth()+i,1); luni.push({k:x.getFullYear()+"-"+pad(x.getMonth()+1),l:LUNA[x.getMonth()].slice(0,3),v:0}); }
  plati.forEach(p=>{ const k=p.d.slice(0,7); const m=luni.find(x=>x.k===k); if(m) m.v+=p.ron; });
  const maxL=Math.max(1,...luni.map(x=>x.v));
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<h3>Calendarul plăților</h3><div class="sub">următoarele 12 luni, la prețurile curente</div>`;
  const w=document.createElement("div"); w.className="dow"; w.style.height="115px";
  luni.forEach(m=>{ w.innerHTML+=`<div class="b"><span class="pv num">${m.v?Math.round(m.v):""}</span><span class="bar" style="height:${m.v?Math.max(3,m.v/maxL*72):2}px"></span><span class="lb">${m.l}</span></div>`; });
  c.appendChild(w);
  const vf=luni.filter(x=>x.v>0), maxM=luni.reduce((a,b)=>b.v>a.v?b:a,luni[0]);
  if(vf.length){ const co=document.createElement("div"); co.className="callout";
    co.innerHTML=`Vârful e în <b>${LUNA[fromIso(maxM.k+"-01").getMonth()]}</b> (${fmtRON(maxM.v)}). Media lunară efectivă: <b>${fmtRON(total/12)}</b>.`;
    c.appendChild(co); }
  body.appendChild(c);
  // lista scadentelor
  const lc=document.createElement("div"); lc.className="card";
  lc.innerHTML=`<h3>Scadențe</h3><div class="sub">${plati.length?"în ordine cronologică":"nicio scadență în următoarele 12 luni"}</div>`+
    plati.slice(0,40).map(p=>{ const st=subStatus(p.s), pz=dataPreaviz(p.s);
      return `<div class="prow"><span class="pd num">${fmtShort(p.d)}</span><span class="pn">${esc(p.s.nume)}${pz&&pz>=todayIso()?` <span style="color:var(--ink3);font-size:11px">· anulare până ${fmtShort(pz)}</span>`:""}</span><span class="pv num">${fmtRON(p.ron)}</span></div>`;
    }).join("");
  body.appendChild(lc);
  body.appendChild(notaCurs());
}

function rapPerioada(body,list){
  const d=fromIso(aboAnchor);
  let from,to,titlu,fromPrev,toPrev,titluPrev;
  if(aboRapMod==="luna"){
    from=iso(new Date(d.getFullYear(),d.getMonth(),1)); to=iso(new Date(d.getFullYear(),d.getMonth()+1,0));
    fromPrev=iso(new Date(d.getFullYear(),d.getMonth()-1,1)); toPrev=iso(new Date(d.getFullYear(),d.getMonth(),0));
    titlu=LUNA[d.getMonth()][0].toUpperCase()+LUNA[d.getMonth()].slice(1)+" "+d.getFullYear(); titluPrev="luna precedentă";
  } else {
    from=iso(new Date(d.getFullYear(),0,1)); to=iso(new Date(d.getFullYear(),11,31));
    fromPrev=iso(new Date(d.getFullYear()-1,0,1)); toPrev=iso(new Date(d.getFullYear()-1,11,31));
    titlu="Anul "+d.getFullYear(); titluPrev="anul precedent";
  }
  const nav=document.createElement("div"); nav.className="periodnav";
  nav.innerHTML=`<h2>${titlu}</h2><div class="navbtns"><button id="aPrev" aria-label="Anterior">‹</button><button id="aNext" aria-label="Următor">›</button></div>`;
  body.appendChild(nav);
  const shift=k=>{ const x=fromIso(aboAnchor); x.setDate(1); if(aboRapMod==="luna") x.setMonth(x.getMonth()+k); else x.setFullYear(x.getFullYear()+k); aboAnchor=iso(x); renderAbo(); };
  nav.querySelector("#aPrev").addEventListener("click",()=>shift(-1));
  nav.querySelector("#aNext").addEventListener("click",()=>shift(1));

  const sum=(f,t2)=>{ let v=0,n=0; list.forEach(s=>scadenteIntre(s,f,t2).forEach(p=>{v+=p.ron;n++;})); return {v,n}; };
  const cur=sum(from,to), prev=sum(fromPrev,toPrev);
  const dp = prev.v? (cur.v-prev.v)/prev.v*100 : null;
  const norm=list.reduce((a,s)=>a+normalizat(s),0)*(aboRapMod==="luna"?1:12);
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${fmtRON(cur.v)}</div><div class="l">plăți în perioadă · ${cur.n}<br>${fmtEUR(cur.v/curs())}</div>
      ${dp!=null?`<span class="delta d ${dp>0?"cost-up":dp<0?"cost-down":"flat"}">${pct(dp)} vs ${titluPrev}</span>`:""}</div>
    <div class="kpi"><div class="v num">${fmtRON(norm)}</div><div class="l">cost normalizat al recurentelor<br>${fmtEUR(norm/curs())}</div></div>`;
  body.appendChild(kp);

  const cat={}, catPrev={};
  list.forEach(s=>{ const k=s.categorie||"—";
    scadenteIntre(s,from,to).forEach(p=>cat[k]=(cat[k]||0)+p.ron);
    scadenteIntre(s,fromPrev,toPrev).forEach(p=>catPrev[k]=(catPrev[k]||0)+p.ron); });
  body.appendChild(bareCard("Pe categorii","plăți efective, cu variația față de "+titluPrev,cat,catPrev));
  const tit={}, titPrev={};
  list.forEach(s=>{ const k=s.titular||"—";
    scadenteIntre(s,from,to).forEach(p=>tit[k]=(tit[k]||0)+p.ron);
    scadenteIntre(s,fromPrev,toPrev).forEach(p=>titPrev[k]=(titPrev[k]||0)+p.ron); });
  body.appendChild(bareCard("Pe titulari","cine suportă costul",tit,titPrev));
  body.appendChild(notaCurs());
}
function bareCard(titlu,sub,obj,objPrev){
  const arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...arr.map(x=>x[1]));
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<h3>${esc(titlu)}</h3><div class="sub">${esc(sub)}</div>`+
    (arr.length?arr.map(([k,v])=>{
      const pv=objPrev?objPrev[k]:null;
      const dp = pv? (v-pv)/pv*100 : null;
      return `<div class="brow"><div class="bl">${esc(k)}</div><div class="bt"><i style="width:${Math.round(v/max*100)}%"></i></div><div class="bv num">${fmtRON(v)}${dp!=null&&Math.abs(dp)>=0.5?`<span class="delta ${dp>0?"cost-up":"cost-down"}">${pct(dp)}</span>`:""}</div></div>`;
    }).join("")
    :`<div class="empty" style="padding:16px 0">nicio plată în perioadă</div>`);
  return c;
}
function notaCurs(){
  const n=document.createElement("div"); n.className="callout";
  n.innerHTML=`Conversiile folosesc cursul <b class="num">${curs().toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:4})} RON/EUR</b> din Setări, aplicat inclusiv plăților din trecut. Costul normalizat aduce abonamentele recurente la echivalent lunar/anual; plățile unice și cele „la nevoie” apar doar în plățile efective.`;
  return n;
}

/* --- raport de prețuri: cine s-a scumpit --- */
function rapPreturi(body,list){
  const cu=list.map(s=>({s,v:variatieTotala(s),r:variatiePret(s)})).filter(x=>x.v);
  const kp=document.createElement("div"); kp.className="kpis";
  const totalAcum=list.reduce((a,s)=>a+normalizat(s)*12,0);
  let totalInitial=0;
  list.forEach(s=>{ const ist=(s.istoric||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
    const p0=ist[0]||{pret:s.pret,moneda:s.moneda};
    totalInitial += periodMonths(s)>0 ? inRON(p0.pret,p0.moneda)/periodMonths(s)*12 : 0; });
  const dpTot = totalInitial? (totalAcum-totalInitial)/totalInitial*100 : null;
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${fmtRON(totalAcum)}</div><div class="l">cost anual la prețurile de azi</div>
      ${dpTot!=null?`<span class="delta d ${dpTot>0?"cost-up":"cost-down"}">${pct(dpTot)} față de prețurile inițiale</span>`:""}</div>
    <div class="kpi"><div class="v num">${fmtRON(totalAcum-totalInitial)}</div><div class="l">diferență anuală acumulată din scumpiri</div></div>`;
  body.appendChild(kp);
  const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<h3>Evoluția prețurilor</h3><div class="sub">${cu.length?"abonamente cu cel puțin două plăți în istoric":"încă niciun abonament reînnoit — istoricul se construiește la fiecare reînnoire"}</div>`;
  cu.sort((a,b)=>b.v.pct-a.v.pct).forEach(({s,v,r})=>{
    c.innerHTML+=`<div class="revrow"><div class="rn"><b>${esc(s.nume)}</b>
      <span>${fmtRON(inRON((s.istoric[0]||{}).pret,(s.istoric[0]||{}).moneda))} → ${fmtRON(subRON(s))} · ${deN((s.istoric||[]).length)}plăți${v.ani>=1?` · ${pct(v.cagr)}/an`:""}</span></div>
      <div class="rv"><span class="delta ${v.pct>0?"cost-up":v.pct<0?"cost-down":"flat"}">${pct(v.pct)}</span></div></div>`;
  });
  body.appendChild(c);
  const rec=list.filter(s=>s.sesiuniTotal>0).map(s=>({s,cu:costUtilizare(s)})).filter(x=>x.cu&&x.cu.folosite);
  if(rec.length){
    const c2=document.createElement("div"); c2.className="card";
    c2.innerHTML=`<h3>Cost pe utilizare</h3><div class="sub">perioada curentă</div>`+
      rec.map(({s,cu:k})=>`<div class="revrow"><div class="rn"><b>${esc(s.nume)}</b><span>${k.folosite} din ${k.total} ședințe · ${fmtRON(subRON(s))}</span></div>
        <div class="rv num">${fmtRON(k.laFolosite)}</div></div>`).join("");
    body.appendChild(c2);
  }
  body.appendChild(notaCurs());
}
