    `Ștergi definitiv „${esc(f.nume)}” și tot istoricul de prețuri? Alternativ poți să-l treci pe inactiv — istoricul rămâne.`,()=>{
      S.subsDeleted.push(f.id); S.subs=S.subs.filter(x=>x.id!==f.id);
      save(); closeModal(); renderAbo(); toast("Abonament șters.");
    }));
  $("#b-save").addEventListener("click",()=>{
    const nume=$("#b-nume").value.trim(); if(!nume){ $("#b-nume").focus(); return; }
    f.nume=nume; f.moneda=moneda;
    f.pret = moneda==="RON" ? (parseFloat(rON.value)||0) : (parseFloat(rEU.value)||0);
    f.recTip=$("#b-recTip").value; f.recN=Math.max(1,parseInt($("#b-recN").value)||1);
    f.start=$("#b-start").value||todayIso();
    f.categorie=$("#b-cat").value==="__new"?f.categorie:$("#b-cat").value;
    f.titular=$("#b-tit").value==="__new"?f.titular:$("#b-tit").value;
    f.obs=$("#b-obs").value.trim();
    if(!Array.isArray(f.istoric)||!f.istoric.length) f.istoric=[{d:f.start,pret:f.pret,moneda:f.moneda,nota:"prima plată"}];
    else { const last=f.istoric[f.istoric.length-1]; last.pret=f.pret; last.moneda=f.moneda;
           if(f.istoric.length===1) last.d=f.start; }
    if((f.sesiuni||[]).length>f.sesiuniTotal*4) f.sesiuni=f.sesiuni.slice(-f.sesiuniTotal*4);
    const i=S.subs.findIndex(x=>x.id===f.id);
    if(i>=0) S.subs[i]=f; else S.subs.push(f);
    save(); closeModal(); renderAbo(); toast(isNew?`„${esc(f.nume)}” adăugat.`:"Salvat.");
  });
}

/* ================================================================
   RAPOARTE OBICEIURI — Revizuire / Săptămână / Lună / An
   ================================================================ */
$$("#rapseg button").forEach(b=>b.addEventListener("click",()=>{
  rapMode=b.dataset.p; $$("#rapseg button").forEach(x=>x.classList.toggle("on",x===b));
  rapAnchor=todayIso(); renderRap(); window.scrollTo({top:0});
}));
$("#rPrev").addEventListener("click",()=>{ rapAnchor=shiftPeriod(rapAnchor,-1); renderRap(); });
$("#rNext").addEventListener("click",()=>{ const n=shiftPeriod(rapAnchor,1); if(startOfPeriod(n)<=todayIso()){ rapAnchor=n; renderRap(); } });
function shiftPeriod(a,dir){
  if(rapMode==="sapt"||rapMode==="rev") return addDays(weekStart(a),7*dir);
  const d=fromIso(a); d.setDate(1);
  if(rapMode==="luna") d.setMonth(d.getMonth()+dir); else d.setFullYear(d.getFullYear()+dir);
  return iso(d);
}
function startOfPeriod(a){
  if(rapMode==="sapt"||rapMode==="rev") return weekStart(a);
  const d=fromIso(a); d.setDate(1);
  if(rapMode==="luna") return iso(d);
  d.setMonth(0); return iso(d);
}
function endOfPeriod(a){
  if(rapMode==="sapt"||rapMode==="rev") return addDays(weekStart(a),6);
  const d=fromIso(a); d.setDate(1);
  if(rapMode==="luna"){ d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); }
  return iso(new Date(d.getFullYear(),11,31));
}
function renderRap(){
  invalidateCache();
  const s=startOfPeriod(rapAnchor), e=endOfPeriod(rapAnchor), t=todayIso();
  let titlu;
  if(rapMode==="rev"){ titlu = weekStart(t)===s ? "Săptămâna curentă" : "Săptămâna "+fmtShort(s); }
  else if(rapMode==="sapt"){ const a=fromIso(s),b=fromIso(e);
    titlu = weekStart(t)===s ? "Săptămâna curentă" : a.getDate()+" – "+b.getDate()+" "+LUNA[b.getMonth()]; }
  else if(rapMode==="luna"){ const d=fromIso(s); titlu=LUNA[d.getMonth()][0].toUpperCase()+LUNA[d.getMonth()].slice(1)+" "+d.getFullYear(); }
  else titlu="Anul "+fromIso(s).getFullYear();
  $("#rapTitle").textContent=titlu;
  $("#rNext").disabled = startOfPeriod(shiftPeriod(rapAnchor,1))>t;
  const body=$("#rapbody"); body.innerHTML="";
  const hs=activeHabits();
  if(!hs.length){ body.innerHTML=`<div class="empty">Niciun obicei activ.</div>`; return; }
  if(rapMode==="rev")  return renderRevizuire(body,s,hs);
  if(rapMode==="sapt") return rapSapt(body,s,hs);
  if(rapMode==="luna") return rapLuna(body,s,e,hs);
  return rapAn(body,s,e,hs);
}

/* --- indicatori per obicei într-o săptămână --- */
const scorSapt = (h,ws) => ({hits:weekHits(h,ws), tinta:h.perWeek, met:weekMet(h,ws)});
function deltaPill(cur,prev,inv){
  if(prev==null) return "";
  const d=cur-prev;
  const cls = d===0?"flat":(inv? (d>0?"down":"up") : (d>0?"up":"down"));
  return `<span class="delta ${cls}">${d>0?"+":""}${Math.round(d*10)/10}</span>`;
}

/* --- REVIZUIREA SĂPTĂMÂNII --- */
function renderRevizuire(body,ws,hs){
  const prevW=addDays(ws,-7), t=todayIso();
  const inCurs = weekStart(t)===ws;
  const intro=document.createElement("div"); intro.className="revcard";
  const zileRamaseS = inCurs ? 7-dow(t)-1 : 0;
  intro.innerHTML=`<h3>Revizuirea săptămânii</h3>
    <div class="sub">${inCurs?(zileRamaseS>0?`mai sunt ${zileTxt(zileRamaseS)} până duminică seara`:"ultima zi a săptămânii — momentul potrivit"):"săptămână încheiată"} · comparat cu săptămâna precedentă</div>`;
  const tot=hs.filter(h=>weekMet(h,ws)).length, totP=hs.filter(h=>weekMet(h,prevW)).length;
  const vot=hs.reduce((a,h)=>a+weekHits(h,ws),0), votP=hs.reduce((a,h)=>a+weekHits(h,prevW),0);
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${tot}/${hs.length}</div><div class="l">obiceiuri cu ținta atinsă</div>
      <span class="delta d ${tot>totP?"up":tot<totP?"down":"flat"}">${tot>totP?"+":""}${tot-totP} vs. săptămâna trecută</span></div>
    <div class="kpi"><div class="v num">${vot}</div><div class="l">voturi în această săptămână</div>
      <span class="delta d ${vot>votP?"up":vot<votP?"down":"flat"}">${vot>votP?"+":""}${vot-votP} vs. ${votP}</span></div>`;
  body.appendChild(intro); body.appendChild(kp);

  /* pe fiecare obicei */
  const c=document.createElement("div"); c.className="revcard";
  c.innerHTML=`<h3>Pe obiceiuri</h3>`;
  hs.forEach(h=>{
    const a=scorSapt(h,ws), b=scorSapt(h,prevW), str=strength(h);
    const r=document.createElement("div"); r.className="revrow";
    r.innerHTML=`<div class="rn"><b>${esc(h.nume)}</b><span>${a.hits}/${a.tinta} · putere ${str}%${a.met?" · ținta atinsă":""}</span></div>
      <div class="rv num" style="color:${a.met?hex(h.culoare):"var(--ink2)"}">${a.hits}${deltaPill(a.hits,b.hits)}</div>`;
    c.appendChild(r);
  });
  body.appendChild(c);

  /* propuneri de calibrare (Goldilocks) */
  const sug=[];
  hs.forEach(h=>{
    const str=strength(h);
    let sapt=0; for(let k=0;k<8;k++){ const w=addDays(ws,-7*k); if(w<weekStart(habStart(h))) break; if(weekMet(h,w)) sapt++; else break; }
    if(str>=93 && sapt>=6 && h.perWeek<(h.lucratoare?5:7))
      sug.push({h,tip:"sus",txt:`<b>${esc(h.nume)}</b> e la ${str}% putere și ${saptTxt(sapt)} consecutive cu ținta atinsă. Regula Goldilocks spune că un obicei prea ușor se plictisește: urci la <b>${h.perWeek+1}×/săptămână</b>?`,act:()=>{h.perWeek++;}});
    else if(str<40 && h.perWeek>1){
      let ratate=0; for(let k=1;k<=4;k++){ const w=addDays(ws,-7*k); if(!weekMet(h,w)) ratate++; }
      if(ratate>=3) sug.push({h,tip:"jos",txt:`<b>${esc(h.nume)}</b> e la ${str}% putere, cu ${ratate} din ultimele 4 săptămâni sub țintă. Mai bine o țintă mai mică respectată: cobori la <b>${h.perWeek-1}×/săptămână</b> pentru o lună?`,act:()=>{h.perWeek--;}});
    }
  });
  if(sug.length){
    const sc=document.createElement("div"); sc.className="revcard";
    sc.innerHTML=`<h3>Calibrare</h3><div class="sub">ținta potrivită e la limita dintre plictiseală și frustrare</div>`;
    sug.slice(0,3).forEach((x,i)=>{
      const d=document.createElement("div"); d.className="sugg";
      d.innerHTML=`<p>${x.txt}</p><div class="acts"><button data-a="da">Da, schimbă</button><button class="no" data-a="nu">Las așa</button></div>`;
      d.addEventListener("click",e=>{
        if(e.target.dataset.a==="da"){ x.act(); save(); renderRap(); toast(`Ținta pentru „${esc(x.h.nume)}” e acum ${x.h.perWeek}×/săptămână.`); }
        else if(e.target.dataset.a==="nu") d.remove();
      });
      sc.appendChild(d);
    });
    body.appendChild(sc);
  }

  /* obstacol + notă */
  const slab=hs.slice().sort((a,b)=>(weekHits(a,ws)/a.perWeek)-(weekHits(b,ws)/b.perWeek))[0];
  const cheie="w"+ws;
  const nc=document.createElement("div"); nc.className="revcard";
  nc.innerHTML=`<h3>Ce a stat în cale</h3>
    <div class="sub">cel mai slab obicei al săptămânii: <b>${esc(slab.nume)}</b> (${weekHits(slab,ws)}/${slab.perWeek})</div>
    <div class="field"><textarea id="revNota" rows="3" placeholder="Ce anume a împiedicat? Scrie o frază — o recitești luna viitoare.">${esc((S.note[cheie]||{}).text||"")}</textarea></div>
    <button class="btn-p" id="revSave" style="width:100%;padding:11px;border-radius:11px;font-weight:700">Salvează nota</button>`;
  body.appendChild(nc);
  $("#revSave").addEventListener("click",()=>{
    S.note[cheie]={text:$("#revNota").value.trim(),d:todayIso()}; save(); toast("Notat. O regăsești în revizuirile viitoare.");
  });
  const vechi=Object.entries(S.note).filter(([k,v])=>k!==cheie && v.text).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,3);
  if(vechi.length){
    const vc=document.createElement("div"); vc.className="revcard";
    vc.innerHTML=`<h3>Din revizuirile anterioare</h3>`+vechi.map(([k,v])=>
      `<div class="revrow"><div class="rn"><b style="font-weight:400;white-space:normal">${esc(v.text)}</b><span>${fmtShort(k.slice(1))}</span></div></div>`).join("");
    body.appendChild(vc);
  }

  /* abonamente + pregătirea săptămânii */
  const urg=subsActive().filter(s=>{const st=subStatus(s); return (st.zile!=null&&st.zile<=14)||st.k==="late";});
  const ac=document.createElement("div"); ac.className="revcard";
  ac.innerHTML=`<h3>Abonamente, următoarele 14 zile</h3>`+
    (urg.length? urg.map(s=>{const st=subStatus(s);
      return `<div class="revrow"><div class="rn"><b>${esc(s.nume)}</b><span>${esc(st.txt)}</span></div><div class="rv num">${fmtRON(subRON(s))}</div></div>`;}).join("")
    : `<div class="sub" style="padding:8px 0">Nimic scadent. Liniște.</div>`);
  body.appendChild(ac);

  const prep=hs.filter(h=>h.cue).slice(0,5);
  if(prep.length){
    const pc=document.createElement("div"); pc.className="revcard";
    pc.innerHTML=`<h3>Pregătirea săptămânii</h3><div class="sub">mediul face jumătate din treabă — pune-le la punct duminică seara</div>`+
      prep.map(h=>`<div class="revrow"><div class="rn"><b>${esc(h.nume)}</b><span>${esc(h.cue)}</span></div></div>`).join("");
    body.appendChild(pc);
  }
}

function rapSapt(body,ws,hs){
  const prevW=addDays(ws,-7), t=todayIso();
  const met=hs.filter(h=>weekMet(h,ws)).length, metP=hs.filter(h=>weekMet(h,prevW)).length;
  const vot=hs.reduce((a,h)=>a+weekHits(h,ws),0), votP=hs.reduce((a,h)=>a+weekHits(h,prevW),0);
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${met}/${hs.length}</div><div class="l">obiceiuri cu ținta atinsă</div><span class="delta d ${met>=metP?"up":"down"}">${met-metP>0?"+":""}${met-metP} vs. săpt. trecută</span></div>
    <div class="kpi"><div class="v num">${vot}</div><div class="l">voturi în săptămână</div><span class="delta d ${vot>=votP?"up":"down"}">${vot-votP>0?"+":""}${vot-votP} vs. ${votP}</span></div>`;
  body.appendChild(kp);
  hs.forEach(h=>{
    const wd=weekDays(ws,h), hits=weekHits(h,ws), hitsP=weekHits(h,prevW);
    const p=Math.min(100,Math.round(hits/h.perWeek*100)), si=streakInfo(h);
    const c=document.createElement("div"); c.className="card"; c.style.setProperty("--hc",hex(h.culoare));
    const zile=wd.map(d=>{
      const n=nivel(h,d);
      const bg = d>t?"var(--raised)": n===1?hex(h.culoare) : n===0.5?`color-mix(in srgb,${hex(h.culoare)} 45%,var(--raised))` : "#4A3F36";
      return `<span title="${d}" style="width:22px;height:22px;border-radius:6px;display:inline-block;background:${bg};outline:${d===t?"1.5px solid var(--ink2)":"none"};outline-offset:1px"></span>`;}).join("");
    let extra="";
    if(isNum(h)){ const avg=mediaSapt(h,ws), avgP=mediaSapt(h,prevW);
      extra=`<div class="statrow"><span>${h.tip==="somn"?"media orelor dormite":"total ore"}</span><b class="num">${avg!=null?(h.tip==="somn"?fmtH2(avg):fmtH2(wd.map(d=>raw(h,d)||0).reduce((a,b)=>a+b,0))):"—"}${avgP!=null&&avg!=null&&h.tip==="somn"?`<span class="delta ${avg>=avgP?"up":"down"}">${avg>avgP?"+":""}${Math.round((avg-avgP)*60)} min</span>`:""}</b></div>`; }
    c.innerHTML=`<h3><span class="dot"></span>${esc(h.nume)}</h3>
      <div class="sub">${esc(h.identitate)} · țintă ${h.perWeek}/${wd.length}${h.lucratoare?" (Lu–Vi)":""}</div>
      <div class="progress"><i style="width:${p}%"></i></div>
      <div class="statrow"><span class="num">${hits} din ${h.perWeek} · ${p}%${deltaPill(hits,hitsP)}</span><span style="display:flex;gap:5px">${zile}</span></div>
      ${extra}
      <div class="statrow"><span>serie curentă</span><b class="num">${unitTxt(si.n,si.unit)}</b></div>
      <div class="statrow"><span>puterea obiceiului (90 de zile)</span><b class="num">${strength(h)}%</b></div>`;
    body.appendChild(c);
  });
}

function rapLuna(body,ms,me,hs){
  const t=todayIso();
  const dprev=fromIso(ms); const pms=iso(new Date(dprev.getFullYear(),dprev.getMonth()-1,1)), pme=iso(new Date(dprev.getFullYear(),dprev.getMonth(),0));
  const voturi=(f,t2)=>{let n=0;hs.forEach(h=>{let d=f;while(d<=t2&&d<=t){if(okDay(h,d))n++;d=addDays(d,1);}});return n;};
  const v=voturi(ms,me), vp=voturi(pms,pme);
  const sapMet=(f,t2)=>{let met=0,tot=0;hs.forEach(h=>{let w=weekStart(f);if(w<f)w=addDays(w,7);
    while(addDays(w,6)<=t2){ if(addDays(w,6)<=t){tot++; if(weekMet(h,w))met++;} w=addDays(w,7);} });return tot?Math.round(met/tot*100):0;};
  const pc1=sapMet(ms,me), pc2=sapMet(pms,pme);
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${v}</div><div class="l">voturi în lună</div><span class="delta d ${v>=vp?"up":"down"}">${v-vp>0?"+":""}${v-vp} vs. luna trecută</span></div>
    <div class="kpi"><div class="v num">${pc1}%</div><div class="l">din săptămânile încheiate cu ținta atinsă</div><span class="delta d ${pc1>=pc2?"up":"down"}">${pc1-pc2>0?"+":""}${pc1-pc2} p.p.</span></div>`;
  body.appendChild(kp);
  hs.forEach(h=>{
    const c=document.createElement("div"); c.className="card"; c.style.setProperty("--hc",hex(h.culoare));
    c.innerHTML=`<h3><span class="dot"></span>${esc(h.nume)}</h3><div class="sub">${esc(h.identitate)} · putere ${strength(h)}%</div>`;
    c.appendChild(heatGrid(h,ms,me));
    c.appendChild(legenda(h));
    body.appendChild(c);
  });
  /* tipar pe zilele săptămânii */
  const dc=document.createElement("div"); dc.className="card";
  dc.innerHTML=`<h3>Tiparul săptămânii</h3><div class="sub">procent de reușite pe fiecare zi, toate obiceiurile</div>`;
  const w=document.createElement("div"); w.className="dow";
  const ok=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  let d=ms; while(d<=me&&d<=t){ const k=dow(d); hs.forEach(h=>{ if(schedDay(h,d)){cnt[k]++; if(okDay(h,d))ok[k]++;} }); d=addDays(d,1); }
  let worst=-1,wp=101;
  for(let i=0;i<7;i++){ const p=cnt[i]?Math.round(ok[i]/cnt[i]*100):null;
    if(p!=null&&p<wp&&cnt[i]>=10){wp=p;worst=i;}
    w.innerHTML+=`<div class="b"><span class="pv num">${p==null?"–":p+"%"}</span><span class="bar" style="height:${p==null?2:Math.max(3,p*0.7)}px"></span><span class="lb">${ZIS[i]}</span></div>`; }
  dc.appendChild(w);
  if(worst>=0&&wp<70){ const co=document.createElement("div"); co.className="callout";
    co.innerHTML=`Cele mai multe ratări sunt <b>${["lunea","marțea","miercurea","joia","vinerea","sâmbăta","duminica"][worst]}</b> (${wp}% reușite). Ce e diferit în ziua aia? Pregătește indiciul de seara.`;
    dc.appendChild(co); }
  body.appendChild(dc);
  /* somn vs. restul — corelația pe care o are doar el */
  const somn=hs.find(h=>h.tip==="somn");
  if(somn){
    let bine=[0,0], slab=[0,0];
    let dd=ms;
    while(dd<=me&&dd<=t){
      const vS=raw(somn,dd);
      if(vS!=null){ const buna=vS>=tintaLa(somn,dd);
        hs.filter(h=>h!==somn).forEach(h=>{ if(!schedDay(h,dd))return; const arr=buna?bine:slab; arr[1]++; if(okDay(h,dd))arr[0]++; }); }
      dd=addDays(dd,1);
    }
    if(bine[1]>=5&&slab[1]>=5){
      const p1=Math.round(bine[0]/bine[1]*100), p2=Math.round(slab[0]/slab[1]*100);
      const cc=document.createElement("div"); cc.className="card";
      cc.innerHTML=`<h3>Somnul și restul obiceiurilor</h3><div class="sub">procent de bife în celelalte obiceiuri, după cum ai dormit</div>
        <div class="brow"><div class="bl">≥ ${fmtH(somn.tintaOre)}</div><div class="bt"><i style="width:${p1}%"></i></div><div class="bv num">${p1}%</div></div>
        <div class="brow"><div class="bl">sub țintă</div><div class="bt"><i style="width:${p2}%;opacity:.45"></i></div><div class="bv num">${p2}%</div></div>
        <div class="callout">${p1-p2>=8?`În zilele cu somn suficient bifezi cu <b>${p1-p2} puncte procentuale</b> mai mult. Somnul nu e un obicei printre altele — e cel care le susține pe celelalte.`:`Diferența e mică (${p1-p2} p.p.) — deocamdată somnul nu explică variațiile celorlalte obiceiuri.`}</div>`;
      body.appendChild(cc);
    }
  }
}
function legenda(h){
  const lg=document.createElement("div"); lg.className="heatlbl"; const c=hex(h.culoare);
  if(isNum(h)){
    lg.innerHTML=`<span><span class="sw" style="background:${c}"></span>≥ ${fmtH(h.tintaOre)}</span>
      <span><span class="sw" style="background:color-mix(in srgb,${c} 45%,var(--raised))"></span>variantă minimă</span>
      <span><span class="sw" style="background:#4A3F36"></span>sub prag / nescris</span>`;
  } else {
    lg.innerHTML=`<span><span class="sw" style="background:${c}"></span>${h.negativ?"zi curată":"făcut"}</span>
      <span><span class="sw" style="background:color-mix(in srgb,${c} 45%,var(--raised))"></span>variantă minimă</span>
      <span><span class="sw" style="background:#4A3F36"></span>ratat</span>
      ${h.lucratoare?'<span><span class="sw" style="border:1px dashed #3A342C;background:transparent"></span>weekend</span>':""}`;

function heatGrid(h,from,to){
  const t=todayIso(), grid=document.createElement("div"); grid.className="heat";
  let w=weekStart(from), col=0, colAzi=-1;
  while(w<=to){
    const c=document.createElement("div"); c.className="col";
    for(let i=0;i<7;i++){
      const d=addDays(w,i), cell=document.createElement("span"); cell.className="cell";
      if(d<from||d>to) cell.style.visibility="hidden";
      else if(inPauza(d)) cell.classList.add("off");
      else if(!schedDay(h,d)) cell.classList.add("off");
      else if(d>t||d<habStart(h)){ /* neutru */ }
      else { const n=nivel(h,d); if(n===1) cell.classList.add("p3"); else if(n===0.5) cell.classList.add("mini"); else cell.classList.add("miss"); }
      if(d===t){ cell.classList.add("today"); colAzi=col; }
      cell.title=d; c.appendChild(cell);
    }
    grid.appendChild(c); w=addDays(w,7); col++;
  }
  requestAnimationFrame(()=>{ if(colAzi>=0){ const cw=16; grid.scrollLeft=Math.max(0,(colAzi+1)*cw-grid.clientWidth+20); } });
  return grid;
}
function rapAn(body,ys,ye,hs){
  const t=todayIso(), an=fromIso(ys).getFullYear();
  const pys=iso(new Date(an-1,0,1)), pye=iso(new Date(an-1,11,31));
  const nrV=(f,t2)=>{let n=0;hs.forEach(h=>{let d=f;while(d<=t2&&d<=t){if(okDay(h,d))n++;d=addDays(d,1);}});return n;};
  const v=nrV(ys,ye), vp=nrV(pys,pye);
  const somn=hs.find(h=>h.tip==="somn");
  let sT=0,sC=0; if(somn){ let d=ys; while(d<=ye&&d<=t){ const x=raw(somn,d); if(x!=null){sT+=x;sC++;} d=addDays(d,1);} }
  const kp=document.createElement("div"); kp.className="kpis";
  kp.innerHTML=`<div class="kpi"><div class="v num" style="color:var(--accent)">${v}</div><div class="l">voturi în ${an}</div>${vp?`<span class="delta d ${v>=vp?"up":"down"}">${v-vp>0?"+":""}${v-vp} vs. ${an-1}</span>`:""}</div>
    <div class="kpi"><div class="v num">${sC?fmtH2(sT/sC):"—"}</div><div class="l">media somnului pe an</div></div>`;
  body.appendChild(kp);
  /* voturi pe luni */
  const luni=Array(12).fill(0);
  hs.forEach(h=>{ let d=ys; while(d<=ye&&d<=t){ if(okDay(h,d)) luni[fromIso(d).getMonth()]++; d=addDays(d,1);} });
  const maxL=Math.max(1,...luni);
  const lc=document.createElement("div"); lc.className="card";
  lc.innerHTML=`<h3>Voturi pe luni</h3><div class="sub">totalul bifelor din fiecare lună</div>`;
  const w=document.createElement("div"); w.className="dow"; w.style.height="110px";
  luni.forEach((x,i)=>{ w.innerHTML+=`<div class="b"><span class="pv num">${x||""}</span><span class="bar" style="height:${x?Math.max(3,x/maxL*72):2}px"></span><span class="lb">${LUNA[i].slice(0,3)}</span></div>`; });
  lc.appendChild(w);
  const best=luni.indexOf(maxL);
  if(maxL>1){ const co=document.createElement("div"); co.className="callout";
    co.innerHTML=`Cea mai bună lună: <b>${LUNA[best]}</b> (${luni[best]} voturi). Total în ${an}: <b>${v}</b>.`; lc.appendChild(co); }
  body.appendChild(lc);
  hs.forEach(h=>{
    const si=streakInfo(h);
    const c=document.createElement("div"); c.className="card"; c.style.setProperty("--hc",hex(h.culoare));
    c.innerHTML=`<h3><span class="dot"></span>${esc(h.nume)}</h3>
      <div class="sub num">cea mai lungă serie: ${unitTxt(si.best,si.unit)} · putere azi ${strength(h)}%</div>`;
    c.appendChild(heatGrid(h,ys,ye)); c.appendChild(legenda(h));
    body.appendChild(c);
  });
  const n=document.createElement("div"); n.className="callout";
  n.innerHTML=`<b>Platoul potențialului latent:</b> munca nu se pierde, se acumulează. Fiecare vot e depozitat — chiar și când rezultatele nu se văd încă.`;
  body.appendChild(n);
}

function renderObi(){
  invalidateCache();
  const ml=$("#mlist"); ml.innerHTML="";
  activeHabits().forEach(h=>{
    const c=document.createElement("div"); c.className="mcard"; c.style.setProperty("--hc",hex(h.culoare));
    const freq=isDaily(h)?(h.lucratoare?"zilnic (Lu–Vi)":"zilnic"):h.perWeek+"× / săpt."+(h.lucratoare?" (Lu–Vi)":"");
    c.innerHTML=`<span class="cdot"></span>
      <div class="mb"><div class="mn">${esc(h.nume)}</div>
        <div class="mi">${esc(h.identitate)} · ${freq}${isNum(h)?" · țintă "+fmtH(h.tintaOre):""}${h.negativ?" · renunțare":""}</div>
        <div class="mi" style="color:${tol(h)===0?"var(--accent)":"var(--ink3)"}">serie: ${TOL_TXT[tol(h)]}</div>
        ${h.mini?`<div class="mi">variantă minimă: ${esc(h.mini)}</div>`:""}</div>
      <div class="acts">
        <button title="Modifică" aria-label="Modifică ${esc(h.nume)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
        <button title="Arhivează" aria-label="Arhivează ${esc(h.nume)}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg></button>
      </div>`;
    const [be,ba]=c.querySelectorAll(".acts button");
    be.addEventListener("click",()=>openForm(h));
    ba.addEventListener("click",()=>{ h.arhivat=true; save(); renderObi(); toast("Arhivat — istoricul rămâne în rapoarte."); });
    ml.appendChild(c);
  });
  const arch=S.habits.filter(h=>h.arhivat), ma=$("#marchived"); ma.innerHTML="";
  if(arch.length){
    ma.innerHTML=`<div class="arch-h">Arhivate</div>`;
    arch.forEach(h=>{
      const c=document.createElement("div"); c.className="mcard"; c.style.setProperty("--hc",hex(h.culoare)); c.style.opacity=".6";
      c.innerHTML=`<span class="cdot"></span><div class="mb"><div class="mn">${esc(h.nume)}</div><div class="mi">${votes(h)} voturi păstrate</div></div>
        <div class="acts"><button title="Reactivează" aria-label="Reactivează">↺</button><button title="Șterge" aria-label="Șterge definitiv" style="color:var(--danger)">✕</button></div>`;
      const [br,bd]=c.querySelectorAll(".acts button");
      br.addEventListener("click",()=>{ h.arhivat=false; save(); renderObi(); });
      bd.addEventListener("click",()=>confirmDlg(`Ștergi definitiv „${esc(h.nume)}” și tot istoricul lui?`,()=>{
        S.deleted.push(h.id); S.habits=S.habits.filter(x=>x.id!==h.id);
        Object.keys(S.entries).forEach(d=>{ if(S.entries[d][h.id]!=null){ delete S.entries[d][h.id]; if(!Object.keys(S.entries[d]).length) delete S.entries[d]; } });
        save(); renderObi(); toast("Șters definitiv.");
      }));
      ma.appendChild(c);
    });
  }
  /* pauze */
  const pb=$("#pauzelist"); pb.innerHTML=`<div class="arch-h">Pauze (concediu, boală, deplasare)</div>`;
  const act=(S.pauze||[]).filter(p=>p.pana>=addDays(todayIso(),-30)).sort((a,b)=>a.de<b.de?1:-1);
  act.forEach(p=>{
    const c=document.createElement("div"); c.className="mcard";
    c.innerHTML=`<span class="cdot" style="background:#5A7FD1"></span>
      <div class="mb"><div class="mn">${esc(p.motiv||"Pauză")}</div><div class="mi">${fmtShort(p.de)} → ${fmtShort(p.pana)} · ${zileTxt(zileIntre(p.de,p.pana)+1)}</div></div>
      <div class="acts"><button aria-label="Șterge pauza" style="color:var(--danger)">✕</button></div>`;
    c.querySelector("button").addEventListener("click",()=>{ S.pauze=S.pauze.filter(x=>x!==p); save(); renderObi(); renderAzi(); });
    pb.appendChild(c);
  });
  const add=document.createElement("button"); add.className="addbtn"; add.style.borderColor="#2F3A4A"; add.style.color="#96AACB";
  add.textContent="+ Programează o pauză";
  add.addEventListener("click",openPauzaForm);
  pb.appendChild(add);
  const nota=document.createElement("div"); nota.className="callout"; nota.style.marginTop="12px";
  nota.innerHTML=`În zilele de pauză nimic nu se contorizează: seriile nu se rup, procentele nu scad, iar rapoartele le sar. E varianta onestă la a minți datele sau a pierde o serie de 100 de zile pentru o gripă.`;
  pb.appendChild(nota);
}

function openForm(h){
  const isNew=!h;
  const f=h?JSON.parse(JSON.stringify(h)):{id:"h"+Date.now(),nume:"",identitate:"",tip:"bifa",negativ:false,perWeek:7,lucratoare:false,
    tintaOre:7,miniOre:5,tolerante:1,mini:"",culoare:PALETA[activeHabits().length%PALETA.length],cue:"",creat:todayIso(),arhivat:false};
  const tintaVeche=f.tintaOre;
  openModal(`
    <h2>${isNew?"Obicei nou":"Modifică obiceiul"}</h2>
    <div class="note">Formulează-l ca intenție: <i>voi [acțiune] la [moment], în [loc]</i>.</div>
    <div class="field"><label>Nume</label><input id="f-nume" value="${esc(f.nume)}" placeholder="ex.: Citit 10 pagini"></div>
    <div class="field"><label>Cine devii? (identitatea)</label><input id="f-id" value="${esc(f.identitate)}" placeholder="ex.: Cititor">
      <div class="hint">Fiecare bifă va fi „un vot pentru: …”. Scopul nu e să citești o carte, ci să devii un cititor.</div></div>
    <div class="field"><label>Indiciul (când / după ce?)</label><input id="f-cue" value="${esc(f.cue||"")}" placeholder="ex.: După cafeaua de dimineață">
      <div class="hint">Legea 1 — fă-l evident. Apare și în lista de pregătire a săptămânii.</div></div>
    <div class="field"><label>Varianta minimă (regula celor 2 minute)</label><input id="f-mini" value="${esc(f.mini||"")}" placeholder="ex.: o lecție de 3 minute">
      <div class="hint">În zilele grele o bifezi pe asta: ține seria vie și contează pe jumătate în rapoarte. „Standardizează înainte să optimizezi.”</div></div>
    <div class="field"><label>Tip</label>
      <select id="f-tip">
        <option value="bifa" ${f.tip==="bifa"?"selected":""}>Bifă (făcut / nefăcut)</option>
        <option value="somn" ${f.tip==="somn"?"selected":""}>Ore de somn (numeric, cu țintă)</option>
        <option value="ore"  ${f.tip==="ore"?"selected":""}>Ore lucrate (numeric, cu țintă minimă)</option>
      </select></div>
    <div id="f-num-w" style="display:${isNum(f)?"block":"none"}">
      <div class="field"><label>Ținta pe zi</label>
        <div class="freqrow"><button id="f-tm">−</button><span class="fv num" id="f-tv">${fmtH(f.tintaOre||7)}</span><button id="f-tp">+</button></div></div>
      <div class="field"><label>Pragul variantei minime</label>
        <div class="freqrow"><button id="f-mm">−</button><span class="fv num" id="f-mv">${fmtH(f.miniOre!=null?f.miniOre:5)}</span><button id="f-mp">+</button></div>
        <div class="hint">Sub țintă, dar peste prag = variantă minimă: seria continuă.</div></div>
    </div>
    <div class="togglerow"><span>Obicei de renunțare („fără …”)<div class="hint">Bifezi ziua curată — votul rămâne pozitiv.</div></span>
      <button class="tg ${f.negativ?"on":""}" id="f-neg" role="switch" aria-checked="${!!f.negativ}"><i></i></button></div>
    <div class="field"><label>Regula seriei</label>
      <div class="ruleopts" id="f-tol">
        <button data-t="0" class="${tol(f)===0?"on":""}"><b>Strict</b><span>orice ratare încheie seria — potrivit renunțărilor</span></button>
        <button data-t="1" class="${tol(f)===1?"on":""}"><b>O omisiune</b><span>o ratare e iertată (maxim una la 7); două la rând încheie seria</span></button>
      </div></div>
    <div class="togglerow"><span>Doar zile lucrătoare (Lu–Vi)</span><button class="tg ${f.lucratoare?"on":""}" id="f-luc" role="switch" aria-checked="${!!f.lucratoare}"><i></i></button></div>
    <div class="field"><label>De câte ori pe săptămână?</label>
      <div class="freqrow"><button id="f-fm">−</button><span class="fv num" id="f-fv"></span><button id="f-fp">+</button></div>
      <div class="hint" id="f-fh"></div></div>
    <div class="field"><label>Culoare</label><div class="swatches" id="f-cul"></div></div>
    <div class="mact">${isNew?"":'<button class="btn-d" id="f-del">Șterge</button>'}
      <button class="btn-s" id="f-cancel">Renunță</button><button class="btn-p" id="f-save">${isNew?"Adaugă":"Salvează"}</button></div>`);

  const syncFreq=()=>{ const max=f.lucratoare?5:7; if(f.perWeek>max) f.perWeek=max;
    $("#f-fv").textContent=f.perWeek+" / "+max;
    $("#f-fh").textContent = f.perWeek>=max?"Zilnic — seria se numără în zile.":"Săptămânal — seria se numără în săptămâni reușite, nu în zile."; };
  const syncCul=()=>{ $("#f-cul").innerHTML=PALETA.map(c=>`<button data-c="${c}" class="${c===f.culoare?"on":""}" style="background:${c}" aria-label="culoare"></button>`).join("");
    $$("#f-cul button").forEach(b=>b.addEventListener("click",()=>{ f.culoare=b.dataset.c; syncCul(); })); };
  syncFreq(); syncCul();
  $("#f-tip").addEventListener("change",e=>{ f.tip=e.target.value; $("#f-num-w").style.display=isNum(f)?"block":"none";
    if(f.tip==="ore"&&f.tintaOre>4){ f.tintaOre=2; f.miniOre=1; $("#f-tv").textContent=fmtH(2); $("#f-mv").textContent=fmtH(1); } });
  $("#f-tm").addEventListener("click",()=>{ f.tintaOre=Math.max(0.5,f.tintaOre-0.5); $("#f-tv").textContent=fmtH(f.tintaOre); });
  $("#f-tp").addEventListener("click",()=>{ f.tintaOre=Math.min(14,f.tintaOre+0.5); $("#f-tv").textContent=fmtH(f.tintaOre); });
  $("#f-mm").addEventListener("click",()=>{ f.miniOre=Math.max(0.25,(f.miniOre||1)-0.25); $("#f-mv").textContent=fmtH(f.miniOre); });
  $("#f-mp").addEventListener("click",()=>{ f.miniOre=Math.min(f.tintaOre,(f.miniOre||1)+0.25); $("#f-mv").textContent=fmtH(f.miniOre); });
  const tg=(sel,get,set,after)=>$(sel).addEventListener("click",e=>{const v=!get();set(v);
    e.currentTarget.classList.toggle("on",v); e.currentTarget.setAttribute("aria-checked",String(v)); if(after)after();});
  tg("#f-neg",()=>!!f.negativ,v=>f.negativ=v);
  tg("#f-luc",()=>!!f.lucratoare,v=>f.lucratoare=v,syncFreq);
  $$("#f-tol button").forEach(b=>b.addEventListener("click",()=>{ f.tolerante=+b.dataset.t; $$("#f-tol button").forEach(x=>x.classList.toggle("on",x===b)); }));
  $("#f-fm").addEventListener("click",()=>{ f.perWeek=Math.max(1,f.perWeek-1); syncFreq(); });
  $("#f-fp").addEventListener("click",()=>{ f.perWeek=Math.min(f.lucratoare?5:7,f.perWeek+1); syncFreq(); });
  $("#f-cancel").addEventListener("click",closeModal);
  if(!isNew) $("#f-del").addEventListener("click",()=>confirmDlg(
    `Ștergi definitiv „${esc(f.nume)}” și tot istoricul? Alternativ: arhivează-l — istoricul rămâne.`,()=>{
      S.deleted.push(f.id); S.habits=S.habits.filter(x=>x.id!==f.id);
      Object.keys(S.entries).forEach(d=>{ if(S.entries[d][f.id]!=null){ delete S.entries[d][f.id]; if(!Object.keys(S.entries[d]).length) delete S.entries[d]; } });
      save(); closeModal(); render(); toast("Șters.");
    }));
  $("#f-save").addEventListener("click",()=>{
    f.nume=$("#f-nume").value.trim();
    if(!f.nume){ $("#f-nume").focus(); return; }
    f.identitate=$("#f-id").value.trim()||"Omul care își ține promisiunile";
    f.cue=$("#f-cue").value.trim(); f.mini=$("#f-mini").value.trim();
    if(isNum(f)){
      if(!f.tinteIstoric) f.tinteIstoric=[{de:f.creat,val:tintaVeche}];
      if(f.tintaOre!==tintaVeche){                       // istoricul rămâne judecat după ținta de atunci
        f.tinteIstoric=[...f.tinteIstoric.filter(x=>x.de!==todayIso()),{de:todayIso(),val:f.tintaOre}].sort((a,b)=>a.de<b.de?-1:1);
      }
      if(f.miniOre==null||f.miniOre>f.tintaOre) f.miniOre=Math.round(f.tintaOre*0.7*4)/4;
    }
    const i=S.habits.findIndex(x=>x.id===f.id);
    if(i>=0) S.habits[i]=f; else S.habits.push(f);
    save(); closeModal(); render();
    toast(isNew?"Obicei adăugat. Primul vot e cel mai important.":"Salvat.");
  });
}

function descarca(nume,continut,tip){
  const b=new Blob([continut],{type:tip}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nume; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportJson(){
  descarca("atomic-gvd-backup-"+todayIso().replace(/-/g,"")+".json", JSON.stringify(S,null,1), "application/json");
  toast("Backup descărcat. Păstrează-l în Drive sau pe e-mail.");
}
function exportCsv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const nl="\r\n", bom="﻿";
  /* 1) bife */
  let a=["Data;Zi;Obicei;Identitate;Nivel;Valoare;Tinta;Reusit"].join("")+nl;
  Object.keys(S.entries).sort().forEach(d=>{
    S.habits.forEach(h=>{ const v=raw(h,d); if(v==null) return;
      a+=[d,ZI[fromIso(d).getDay()],q(h.nume),q(h.identitate),nivel(h,d)===1?"complet":"minim",String(v).replace(".",","),
          isNum(h)?String(tintaLa(h,d)).replace(".",","):"",okDay(h,d)?"DA":"NU"].join(";")+nl; });
  });
  descarca("atomic-gvd-bife-"+todayIso().replace(/-/g,"")+".csv", bom+a, "text/csv");
  /* 2) abonamente */
  let b=["Denumire;Categorie;Titular;Pret;Moneda;Pret RON;Recurenta;Prima plata;Scadenta;Zile ramase;Reinnoire auto;Preaviz zile;Cost lunar RON;Cost anual RON;Sedinte incluse;Sedinte folosite;Cost pe sedinta;Variatie ultima %;Variatie totala %;Observatii"].join("")+nl;
  (S.subs||[]).forEach(s=>{ const st=subStatus(s), per=subPeriod(s), p=ultimaPlata(s), vr=variatiePret(s), vt=variatieTotala(s), cu=costUtilizare(s);
    b+=[q(s.nume),q(s.categorie),q(s.titular),String(p.pret).replace(".",","),p.moneda,String(Math.round(subRON(s)*100)/100).replace(".",","),
        q(recTxt(s)),s.start,per.end||"",st.zile??"",s.auto?"DA":"NU",s.preavizZile||0,
        String(Math.round(normalizat(s)*100)/100).replace(".",","),String(Math.round(normalizat(s)*12*100)/100).replace(".",","),
        s.sesiuniTotal||0,cu?cu.folosite:"",cu&&cu.laFolosite?String(Math.round(cu.laFolosite*100)/100).replace(".",","):"",
        vr?String(Math.round(vr.pct*10)/10).replace(".",","):"",vt?String(Math.round(vt.pct*10)/10).replace(".",","):"",q(s.obs)].join(";")+nl; });
  descarca("atomic-gvd-abonamente-"+todayIso().replace(/-/g,"")+".csv", bom+b, "text/csv");
  /* 3) istoric preturi */
  let c=["Abonament;Data platii;Pret;Moneda;Pret RON;Variatie fata de anterioara %;Variatie lei;Nota"].join("")+nl;
  (S.subs||[]).forEach(s=>{ const ist=(s.istoric||[]).slice().sort((x,y)=>x.d<y.d?-1:1);
    ist.forEach((p,i)=>{ const ron=inRON(p.pret,p.moneda); let dp="",dl="";
      if(i>0){ const pv=inRON(ist[i-1].pret,ist[i-1].moneda); if(pv){ dp=String(Math.round((ron-pv)/pv*1000)/10).replace(".",","); dl=String(Math.round((ron-pv)*100)/100).replace(".",","); } }
      c+=[q(s.nume),p.d,String(p.pret).replace(".",","),p.moneda,String(Math.round(ron*100)/100).replace(".",","),dp,dl,q(p.nota||"")].join(";")+nl; }); });
  descarca("atomic-gvd-istoric-preturi-"+todayIso().replace(/-/g,"")+".csv", bom+c, "text/csv");
  toast("Trei fișiere CSV descărcate, gata de deschis în Excel.");
}
function importJson(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change",()=>{
    const file=inp.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.habits)||typeof d.entries!=="object") throw 0;
        localStorage.setItem(LSKEY,JSON.stringify(d));
        load(); render();
        toast("Importat: "+deN(d.habits.length)+"obiceiuri, "+deN(Object.keys(d.entries).length)+"zile, "+deN((d.subs||[]).length)+"abonamente.");
      }catch(e){ toast("Fișier invalid — alege un backup Atomic GVD (.json)."); } };
    r.readAsText(file);
  });
  inp.click();
}

/* ---------------- notificări locale ---------------- */
function notifTick(){
  const st=S.settings;
  if(!st.notifOn||!("Notification" in window)||Notification.permission!=="granted") return;
  const now=new Date(), hm=pad(now.getHours())+":"+pad(now.getMinutes()), t=todayIso();
  [["am",st.notifAm],["pm",st.notifPm]].forEach(([k,tm])=>{
    if(hm<tm || st.lastNotif[k]===t) return;
    st.lastNotif[k]=t; save(false);
    const de=activeHabits().filter(h=>dueToday(h,t));
    let body = de.length ? (k==="am"?"De făcut azi: ":"Au mai rămas: ")+de.slice(0,4).map(h=>h.nume).join(", ")+(de.length>4?" …":"")
                         : "Tot ce era de făcut azi e bifat. Impecabil.";
    const urg=abonamenteUrgente();
    if(urg.length) body+="\nAbonamente: "+urg.slice(0,2).map(s=>s.nume+" — "+subStatus(s).txt).join("; ");
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready)
        navigator.serviceWorker.ready.then(reg=>reg.showNotification("Atomic GVD",{body,icon:"icon-192.png",badge:"icon-192.png",tag:"agvd-"+k}));
      else new Notification("Atomic GVD",{body});
    }catch(e){}
  });
}
setInterval(notifTick,60000);

/* ================================================================
   PORNIRE
   ================================================================ */
function render(){
  if(scr==="azi") renderAzi();
  else if(scr==="rap") renderRap();
  else if(scr==="abo") renderAbo();
  else if(scr==="obi") renderObi();
  else renderSet();
}
load();
render();
notifTick();
/* la revenirea în aplicație: dacă s-a schimbat ziua, revenim la ziua curentă */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  if(viewDate!==todayIso() && !document.querySelector("#todaychip button:focus")) viewDate=todayIso();
  render(); notifTick();
});
setInterval(()=>{ if(viewDate!==todayIso() && scr==="azi" && !document.hidden){ viewDate=todayIso(); renderAzi(); } },60000);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script>
